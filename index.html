<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Tactical FPS Classic Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; touch-action: none; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }

        /* Main Menu Overlay */
        #main-menu {
            position: absolute; inset: 0; z-index: 200;
            background: rgba(15, 23, 42, 0.85);
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
        }
        .menu-title {
            font-size: 42px; font-weight: 900; letter-spacing: 3px; color: #00ffcc;
            text-shadow: 0 0 20px rgba(0,255,204,0.5); margin-bottom: 5px;
        }
        .menu-subtitle { color: #81e6d9; font-size: 13px; letter-spacing: 2px; margin-bottom: 25px; text-transform: uppercase; }

        .menu-btn {
            width: 200px; padding: 12px 0; margin: 6px 0;
            background: rgba(255, 255, 255, 0.1); border: 1.5px solid #00ffcc;
            color: #fff; font-weight: 800; font-size: 14px; border-radius: 8px; cursor: pointer;
            transition: all 0.2s; text-transform: uppercase;
        }
        .menu-btn:active, .menu-btn:hover { background: #00ffcc; color: #000; box-shadow: 0 0 15px rgba(0,255,204,0.6); }
        .menu-btn-primary { background: #00ffcc; color: #000; }

        /* Top HUD */
        #hud-top {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
            display: flex; gap: 15px; background: rgba(0, 0, 0, 0.6); padding: 6px 18px;
            border-radius: 12px; border: 1px solid rgba(0, 255, 204, 0.4); color: #fff; font-weight: bold; font-size: 13px;
        }
        .score-val { color: #00ffcc; }

        /* Mobile Pause Button */
        #btn-pause-ui {
            position: absolute; top: 12px; right: 12px; z-index: 50;
            width: 40px; height: 40px; border-radius: 50%; background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3); display: none; align-items: center; justify-content: center;
            cursor: pointer;
        }

        /* Bottom HUD */
        #hud-bottom {
            position: absolute; bottom: 15px; left: 15px; z-index: 10;
            display: flex; flex-direction: column; gap: 6px; pointer-events: none;
        }
        .hp-bar {
            width: 160px; height: 14px; background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.4); border-radius: 6px; overflow: hidden; position: relative;
        }
        #hp-fill { height: 100%; width: 100%; background: #ff4757; transition: width 0.1s; }
        .hp-text { position: absolute; inset: 0; font-size: 10px; font-weight: bold; color: #fff; display: flex; align-items: center; justify-content: center; }
        #ammo-ui { color: #eccc68; font-size: 16px; font-weight: 900; text-shadow: 1px 1px 3px #000; }

        /* Mobile Weapon Slots */
        #weapon-slots {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); z-index: 30;
            display: none; gap: 8px; background: rgba(0, 0, 0, 0.6); padding: 5px; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .slot-box {
            width: 50px; height: 50px; border-radius: 6px; background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3); display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer; color: #aaa;
        }
        .slot-box.active { border-color: #00ffcc; background: rgba(0, 255, 204, 0.3); color: #fff; }
        .slot-box svg { width: 20px; height: 20px; fill: currentColor; }
        .slot-box span { font-size: 8px; font-weight: bold; margin-top: 2px; }

        /* Crosshair & Slash */
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 14px; height: 14px; pointer-events: none; z-index: 15;
            display: flex; align-items: center; justify-content: center;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #00ffcc; }
        #crosshair::before { width: 2px; height: 10px; }
        #crosshair::after { width: 10px; height: 2px; }

        #slash-effect {
            position: absolute; inset: 0; pointer-events: none; z-index: 14; opacity: 0;
            background: radial-gradient(circle at center, rgba(0, 255, 204, 0.25) 0%, transparent 60%);
            transition: opacity 0.1s;
        }

        /* Mobile Controls */
        #mobile-controls { display: none; }
        #touch-container { position: absolute; inset: 0; z-index: 20; }
        #move-zone { position: absolute; top: 0; left: 0; width: 50vw; height: 100vh; }
        #look-zone { position: absolute; top: 0; right: 0; width: 50vw; height: 100vh; }
        
        #joy-base {
            position: absolute; width: 100px; height: 100px; background: rgba(255,255,255,0.1);
            border: 2px solid #00ffcc; border-radius: 50%; display: none; pointer-events: none;
        }
        #joy-knob {
            position: absolute; top: 25px; left: 25px; width: 50px; height: 50px;
            background: #00ffcc; border-radius: 50%; pointer-events: none;
        }

        #btn-group { position: absolute; bottom: 15px; right: 15px; display: grid; grid-template-columns: repeat(3, 54px); gap: 8px; z-index: 30; }
        .btn-svg {
            width: 54px; height: 54px; border-radius: 50%; background: rgba(0, 0, 0, 0.7);
            border: 1.5px solid rgba(255,255,255,0.4); color: white;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-svg svg { width: 22px; height: 22px; fill: currentColor; }
        .btn-fire { background: #ff4757; border-color: #ff6b81; grid-row: span 2; height: 116px; border-radius: 26px; }

        /* Settings Modal */
        #settings-menu {
            display: none; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.88);
            z-index: 300; flex-direction: column; align-items: center; justify-content: center; color: #fff;
        }
        .settings-card {
            background: #1e272e; border: 1px solid #00ffcc;
            padding: 20px 25px; border-radius: 12px; width: 310px; display: flex; flex-direction: column; gap: 12px;
        }
        .setting-box { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: bold; }
        .setting-box select, .setting-box input[type="range"] {
            background: #0f172a; color: #00ffcc; border: 1px solid #00ffcc;
            padding: 4px; border-radius: 4px; outline: none;
        }

        #game-over { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.9); color: #ff4757; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

    <div id="main-menu">
        <div class="menu-title">TACTICAL FPS</div>
        <div class="menu-subtitle" id="device-info">Sistem Hazırlanıyor...</div>
        <button class="menu-btn menu-btn-primary" onclick="startGame()">OYUNA BAŞLA</button>
        <button class="menu-btn" onclick="openSettings()">AYARLAR</button>
    </div>

    <div id="crosshair"></div>
    <div id="slash-effect"></div>

    <div id="hud-top">
        <div>LEŞ: <span id="kills" class="score-val">0</span></div>
        <div style="color:rgba(255,255,255,0.3);">|</div>
        <div>SKOR: <span id="score" class="score-val" style="color:#eccc68;">0</span></div>
    </div>

    <div id="btn-pause-ui">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </div>

    <div id="hud-bottom">
        <div id="ammo-ui">AMMO: <span id="ammo-cur">30</span> / <span id="ammo-reserve">90</span></div>
        <div class="hp-bar">
            <div id="hp-fill"></div>
            <div class="hp-text">HP: <span id="hp">100</span></div>
        </div>
    </div>

    <div id="weapon-slots">
        <div class="slot-box active" id="slot-1" onclick="switchWeapon(1)">
            <svg viewBox="0 0 24 24"><path d="M21 7l-5-2-4 2-4-2-5 2v10l5-2 4 2 4-2 5 2V7z"/></svg>
            <span>TÜFEK</span>
        </div>
        <div class="slot-box" id="slot-2" onclick="switchWeapon(2)">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>
            <span>TABANCA</span>
        </div>
        <div class="slot-box" id="slot-3" onclick="switchWeapon(3)">
            <svg viewBox="0 0 24 24"><path d="M14.12 10.47L12 12.59l-2.12-2.12-2.12 2.12L9.88 14.71 12 12.59l2.12 2.12 2.12-2.12zM19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
            <span>BIÇAK</span>
        </div>
    </div>

    <div id="mobile-controls">
        <div id="touch-container">
            <div id="move-zone"></div>
            <div id="look-zone"></div>
            <div id="joy-base"><div id="joy-knob"></div></div>
        </div>

        <div id="btn-group">
            <div class="btn-svg" id="btn-aim">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7.44-7.93H7v-2H5.56c.44-4.08 3.5-7.44 7.44-7.93V5h2v1.57c3.95.49 7 3.85 7.44 7.93H18v2h1.44c-.44 4.08-3.5 7.44-7.44 7.93V19h-2v.93z"/></svg>
            </div>
            <div class="btn-svg" id="btn-reload">
                <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
            </div>
            <div class="btn-svg btn-fire" id="btn-fire">
                <svg viewBox="0 0 24 24"><path d="M12 23c6.075 0 11-4.925 11-11S18.075 1 12 1 1 5.925 1 12s4.925 11 11 11zm0-18a7 7 0 110 14 7 7 0 010-14z"/></svg>
            </div>
            <div class="btn-svg" id="btn-jump">
                <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
            </div>
            <div class="btn-svg" id="btn-crouch">
                <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-5V4h-6v8H4z"/></svg>
            </div>
        </div>
    </div>

    <div id="settings-menu">
        <div class="settings-card">
            <h3 style="color:#00ffcc; text-align:center;">OYUN AYARLARI</h3>
            
            <div class="setting-box">
                <span>Grafik Kalitesi:</span>
                <select id="gfx-quality" onchange="applySettings()">
                    <option value="high" selected>Yüksek (Gölgeli)</option>
                    <option value="low">Düşük (Hızlı)</option>
                </select>
            </div>

            <div class="setting-box">
                <span>Görüş Açısı (FOV):</span>
                <input type="range" id="fov-slider" min="60" max="100" value="75" onchange="applySettings()">
            </div>

            <div class="setting-box">
                <span>Hassasiyet:</span>
                <input type="range" id="sens-slider" min="1" max="10" value="5" onchange="applySettings()">
            </div>

            <div class="setting-box">
                <span>Ses Seviyesi:</span>
                <input type="range" id="volume-slider" min="0" max="10" value="8" onchange="applySettings()">
            </div>

            <button class="menu-btn menu-btn-primary" style="width:100%; margin-top:8px;" onclick="closeSettings()">KAYDET & DEVAM ET</button>
        </div>
    </div>

    <div id="game-over">
        <h1 style="font-size: 38px;">ÖLDÜN!</h1>
        <button onclick="location.reload()" class="menu-btn menu-btn-primary" style="margin-top:15px;">YENİDEN BAŞLA</button>
    </div>

<script>
// DAHİLİ SES SENTEZLEYİCİ
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }

function playSound(type) {
    if (!audioCtx || settings.volume === 0) return;
    let masterGain = audioCtx.createGain();
    masterGain.gain.value = settings.volume;
    masterGain.connect(audioCtx.destination);

    if (type === 'shoot') {
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.connect(gain); gain.connect(masterGain);
        osc.start(); osc.stop(audioCtx.currentTime + 0.12);
    } 
    else if (type === 'knife_swoosh') {
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(masterGain);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }
    else if (type === 'hit') {
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain); gain.connect(masterGain);
        osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    }
    else if (type === 'reload') {
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.connect(gain); gain.connect(masterGain);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }
    else if (type === 'step') {
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(70, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
        osc.connect(gain); gain.connect(masterGain);
        osc.start(); osc.stop(audioCtx.currentTime + 0.04);
    }
}

// CİHAZ TESPİTİ
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
document.getElementById('device-info').innerText = isMobile ? "Mobil Cihaz (Dokunmatik)" : "PC Platformu (Klavye & Fare)";

if (isMobile) {
    document.getElementById('mobile-controls').style.display = 'block';
    document.getElementById('btn-pause-ui').style.display = 'flex';
    document.getElementById('weapon-slots').style.display = 'flex';
}

let settings = { graphics: 'high', sens: 0.003, fov: 75, volume: 0.8 };
let isPaused = false, isGameStarted = false;

// ESKİ SAF GRAFİK KODLARI (SİYAH EKRAN VERMEYEN TEMİZ RENDERER)
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111827);
scene.fog = new THREE.Fog(0x111827, 20, 120);

const camera = new THREE.PerspectiveCamera(settings.fov, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap; // Mobil dostu klasik gölge
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
sunLight.position.set(50, 80, 30);
sunLight.castShadow = true;
scene.add(sunLight);

// Zemin
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(250, 250),
    new THREE.MeshLambertMaterial({ color: 0x1f2937 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(250, 50, 0x00ffcc, 0x374151);
grid.position.y = 0.01;
scene.add(grid);

// Harita Binaları
function createBuilding(x, z, w, h, d, color = 0x374151) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }));
    mesh.position.set(x, h / 2, z);
    mesh.castShadow = true; mesh.receiveShadow = true;
    scene.add(mesh);
}
createBuilding(-30, -30, 16, 12, 16);
createBuilding(30, -30, 16, 12, 16);
createBuilding(0, -50, 24, 15, 12);

// Oyuncu
const playerGroup = new THREE.Group();
playerGroup.position.set(0, 1.7, 30);
scene.add(playerGroup); playerGroup.add(camera);

// ESKİ EFSANE SİLAH MODELLERİ
const gunGroup = new THREE.Group();
gunGroup.position.set(0.2, -0.2, -0.4);
camera.add(gunGroup);

const matDark = new THREE.MeshLambertMaterial({color: 0x111827});
const matMetal = new THREE.MeshLambertMaterial({color: 0x6b7280});

// 1. Tüfek
const rifleMesh = new THREE.Group();
const rBody = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.08, 0.4), matDark);
const rBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.5), matMetal);
rBarrel.rotation.x = Math.PI / 2; rBarrel.position.set(0, 0.02, -0.38);
rifleMesh.add(rBody, rBarrel);

// 2. Tabanca
const pistolMesh = new THREE.Group();
const pSlide = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.05, 0.2), matMetal);
pSlide.position.set(0, 0.02, -0.05);
const pGrip = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.1, 0.05), matDark);
pGrip.position.set(0, -0.04, 0.02); pGrip.rotation.x = -0.2;
pistolMesh.add(pSlide, pGrip);
pistolMesh.visible = false;

// 3. Taktik Bıçak
const knifeMesh = new THREE.Group();
const kBladeMat = new THREE.MeshBasicMaterial({color: 0x00ffcc});
const kHandle = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.035, 0.14), matDark);
const kBlade = new THREE.Mesh(new THREE.BoxGeometry(0.006, 0.045, 0.24), kBladeMat);
kBlade.position.set(0, 0.01, -0.18);
knifeMesh.add(kHandle, kBlade);
knifeMesh.visible = false;

gunGroup.add(rifleMesh, pistolMesh, knifeMesh);

// Muzzle Flash
const muzzleFlash = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshBasicMaterial({color: 0xffaa00, transparent: true, opacity: 0}));
muzzleFlash.position.set(0, 0.02, -0.65);
gunGroup.add(muzzleFlash);

// DÜŞMAN BOTLAR
let enemies = [];
function spawnEnemy() {
    const enemyGroup = new THREE.Group();
    const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.4, 0.6), new THREE.MeshLambertMaterial({color: 0xef4444}));
    bodyMesh.position.y = 0.7; bodyMesh.userData = { type: 'body' }; bodyMesh.castShadow = true;

    const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 10), new THREE.MeshLambertMaterial({color: 0xf87171}));
    headMesh.position.y = 1.65; headMesh.userData = { type: 'head' }; headMesh.castShadow = true;

    enemyGroup.add(bodyMesh, headMesh);

    let angle = Math.random() * Math.PI * 2, dist = 25 + Math.random() * 30;
    enemyGroup.position.set(playerGroup.position.x + Math.cos(angle)*dist, 0, playerGroup.position.z + Math.sin(angle)*dist);

    scene.add(enemyGroup);
    enemies.push({ group: enemyGroup, head: headMesh, body: bodyMesh, hp: 100, lastShoot: 0 });
}
for(let i=0; i<5; i++) spawnEnemy();

// SİLAH DEĞİŞTİRME
let currentSlot = 1;
let weaponAmmo = { 1: { cur: 30, res: 90 }, 2: { cur: 12, res: 48 }, 3: { cur: '∞', res: '∞' } };
let isSwitching = false;

function switchWeapon(slot) {
    if(currentSlot === slot || isPaused || isSwitching) return;
    isSwitching = true;

    currentSlot = slot;
    rifleMesh.visible = (slot === 1);
    pistolMesh.visible = (slot === 2);
    knifeMesh.visible = (slot === 3);

    if(isMobile) {
        document.querySelectorAll('.slot-box').forEach(el => el.classList.remove('active'));
        document.getElementById(`slot-${slot}`).classList.add('active');
    }
    updateHUD();
    setTimeout(() => { isSwitching = false; }, 150);
}

// OYUNU BAŞLATMA VE MENÜ KONTROLLERİ
function startGame() {
    initAudio();
    document.getElementById('main-menu').style.display = 'none';
    isGameStarted = true;
    resetTouchStates(); // Dokunmatik hatasını önlemek için sıfırla

    if (!isMobile) document.body.requestPointerLock();
}

function openSettings() {
    document.getElementById('settings-menu').style.display = 'flex';
}

function closeSettings() {
    document.getElementById('settings-menu').style.display = 'none';
    isPaused = false;
    resetTouchStates(); // MENÜ KAPANDIKTAN SONRA MOBİL KONTROLLERİ SIFIRLA VE DONMAYI ÇÖZ
    if(isGameStarted && !isMobile) document.body.requestPointerLock();
}

function pauseGame() {
    isPaused = true;
    resetTouchStates();
    openSettings();
    if (document.exitPointerLock) document.exitPointerLock();
}

// MOBİL DOKUNMATİK SIFIRLAMA (DONMA HATASINI ÇÖZEN KISIM)
function resetTouchStates() {
    moveTouchId = null;
    lookTouchId = null;
    moveInput = { x: 0, y: 0 };
    document.getElementById('joy-base').style.display = 'none';
}

// KONTROLLER
let keys = {};
window.addEventListener('keydown', e => {
    if(!isGameStarted) return;
    keys[e.code] = true;
    if (e.code === 'KeyR') reloadGun();
    if (e.code === 'KeyP' || e.code === 'Escape') { if(isPaused) closeSettings(); else pauseGame(); }
    if (e.code === 'Digit1') switchWeapon(1);
    if (e.code === 'Digit2') switchWeapon(2);
    if (e.code === 'Digit3') switchWeapon(3);
    if (e.code === 'Space') jumpPlayer();
});
window.addEventListener('keyup', e => keys[e.code] = false);

window.addEventListener('mousemove', e => {
    if (!isMobile && document.pointerLockElement === document.body && !isPaused) {
        yaw -= e.movementX * settings.sens;
        pitch -= e.movementY * settings.sens;
        pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
    }
});

window.addEventListener('mousedown', e => {
    if (!isMobile && isGameStarted && !isPaused) {
        if (e.button === 0) handleAttack();
        if (e.button === 2) toggleAim();
    }
});
window.addEventListener('contextmenu', e => e.preventDefault());

// MOBİL DOKUNMATİK SİSTEMİ
let moveInput = { x: 0, y: 0 }, yaw = 0, pitch = 0;
let moveTouchId = null, lookTouchId = null;
let joyCenter = { x: 0, y: 0 }, lastLookPos = { x: 0, y: 0 };

if (isMobile) {
    const moveZone = document.getElementById('move-zone');
    const lookZone = document.getElementById('look-zone');
    const joyBase = document.getElementById('joy-base');
    const joyKnob = document.getElementById('joy-knob');

    moveZone.addEventListener('touchstart', e => {
        if(isPaused) return;
        e.preventDefault();
        for (let t of e.changedTouches) {
            if (moveTouchId === null) {
                moveTouchId = t.identifier;
                joyCenter = { x: t.clientX, y: t.clientY };
                joyBase.style.left = (t.clientX - 50) + 'px';
                joyBase.style.top = (t.clientY - 50) + 'px';
                joyBase.style.display = 'block';
            }
        }
    }, {passive: false});

    lookZone.addEventListener('touchstart', e => {
        if(isPaused) return;
        e.preventDefault();
        for (let t of e.changedTouches) {
            if (lookTouchId === null) {
                lookTouchId = t.identifier;
                lastLookPos = { x: t.clientX, y: t.clientY };
            }
        }
    }, {passive: false});

    window.addEventListener('touchmove', e => {
        if(isPaused) return;
        for (let t of e.touches) {
            if (t.identifier === moveTouchId) {
                let dx = t.clientX - joyCenter.x, dy = t.clientY - joyCenter.y;
                let dist = Math.hypot(dx, dy), maxDist = 40;
                if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
                joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                moveInput.x = dx / maxDist; moveInput.y = dy / maxDist;
            }
            if (t.identifier === lookTouchId) {
                let dx = t.clientX - lastLookPos.x, dy = t.clientY - lastLookPos.y;
                yaw -= dx * settings.sens; pitch -= dy * settings.sens;
                pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
                lastLookPos = { x: t.clientX, y: t.clientY };
            }
        }
    }, {passive: false});

    const resetTouch = (id) => {
        if (id === moveTouchId) { moveTouchId = null; moveInput = { x: 0, y: 0 }; joyBase.style.display = 'none'; }
        if (id === lookTouchId) lookTouchId = null;
    };
    window.addEventListener('touchend', e => { for (let t of e.changedTouches) resetTouch(t.identifier); });

    document.getElementById('btn-fire').addEventListener('touchstart', e => { e.preventDefault(); handleAttack(); });
    document.getElementById('btn-aim').addEventListener('touchstart', e => { e.preventDefault(); toggleAim(); });
    document.getElementById('btn-reload').addEventListener('touchstart', e => { e.preventDefault(); reloadGun(); });
    document.getElementById('btn-jump').addEventListener('touchstart', e => { e.preventDefault(); jumpPlayer(); });
    document.getElementById('btn-crouch').addEventListener('touchstart', e => { e.preventDefault(); crouchPlayer(); });
    document.getElementById('btn-pause-ui').addEventListener('click', (e) => { e.stopPropagation(); pauseGame(); });
}

// GÜVENLİ VE GÖLGE HATASI VERMEYEN AYARLAR
function applySettings() {
    let qual = document.getElementById('gfx-quality').value;
    renderer.shadowMap.enabled = (qual === 'high');
    
    settings.fov = parseInt(document.getElementById('fov-slider').value);
    camera.fov = settings.fov; camera.updateProjectionMatrix();
    
    settings.sens = document.getElementById('sens-slider').value * 0.0007;
    settings.volume = document.getElementById('volume-slider').value / 10;
}

// ATEŞ VE BIÇAK MEKANİĞİ
let pState = { hp: 100, kills: 0, score: 0 };
let velocityY = 0, isGrounded = true, isCrouching = false, isAiming = false;
let isAttacking = false;

function handleAttack() {
    if(isSwitching || isAttacking || isPaused) return;

    if (currentSlot === 3) {
        // BIÇAK SALDIRISI (YAKIN MESAFE)
        isAttacking = true;
        playSound('knife_swoosh');

        gunGroup.position.z = -0.2;
        gunGroup.rotation.y = -0.6;
        document.getElementById('slash-effect').style.opacity = '1';

        setTimeout(() => {
            gunGroup.position.z = -0.4;
            gunGroup.rotation.y = 0;
            document.getElementById('slash-effect').style.opacity = '0';
            isAttacking = false;
        }, 150);

        // Yakın Mesafe Kontrolü (Max 2.5m)
        enemies.forEach((enemy, index) => {
            let dist = enemy.group.position.distanceTo(playerGroup.position);
            if (dist <= 2.8) {
                playSound('hit');
                enemy.hp -= 80;
                pState.score += 100;

                if(enemy.hp <= 0) {
                    scene.remove(enemy.group);
                    enemies.splice(index, 1);
                    pState.kills++; updateHUD();
                    setTimeout(spawnEnemy, 2000);
                }
            }
        });

    } else {
        // ATEŞLİ SİLAH
        let wData = weaponAmmo[currentSlot];
        if (wData.cur <= 0) { reloadGun(); return; }

        wData.cur--; updateHUD();
        playSound('shoot');

        gunGroup.position.z = -0.32;
        pitch += 0.01;
        muzzleFlash.material.opacity = 1;

        setTimeout(() => { gunGroup.position.z = -0.4; muzzleFlash.material.opacity = 0; }, 40);

        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

        enemies.forEach((enemy, index) => {
            const intersects = raycaster.intersectObjects([enemy.head, enemy.body]);
            if(intersects.length > 0) {
                playSound('hit');
                let hitHead = intersects[0].object.userData.type === 'head';
                let dmg = currentSlot === 1 ? (hitHead ? 100 : 35) : (hitHead ? 70 : 25);

                enemy.hp -= dmg;
                pState.score += hitHead ? 150 : 50;

                if(enemy.hp <= 0) {
                    scene.remove(enemy.group);
                    enemies.splice(index, 1);
                    pState.kills++; updateHUD();
                    setTimeout(spawnEnemy, 2000);
                }
            }
        });
    }
}

function toggleAim() {
    if (currentSlot === 3) return;
    isAiming = !isAiming;
    camera.fov = isAiming ? 45 : settings.fov;
    gunGroup.position.set(isAiming ? 0 : 0.2, isAiming ? -0.12 : -0.2, isAiming ? -0.22 : -0.4);
    camera.updateProjectionMatrix();
}

function reloadGun() {
    if (currentSlot === 3 || isSwitching) return;
    let wData = weaponAmmo[currentSlot];
    let maxAmmo = (currentSlot === 1) ? 30 : 12;

    if (wData.cur < maxAmmo && wData.res > 0) {
        playSound('reload');
        let reloadAmount = Math.min(maxAmmo - wData.cur, wData.res);
        wData.res -= reloadAmount; wData.cur += reloadAmount;
        
        gunGroup.rotation.z = -0.5;
        setTimeout(() => { gunGroup.rotation.z = 0; updateHUD(); }, 350);
    }
}

function jumpPlayer() { if (isGrounded) { velocityY = 6.0; isGrounded = false; } }
function crouchPlayer() { isCrouching = !isCrouching; playerGroup.position.y = isCrouching ? 1.0 : 1.7; }

function updateHUD() {
    document.getElementById('kills').innerText = pState.kills;
    document.getElementById('score').innerText = pState.score;
    document.getElementById('ammo-cur').innerText = weaponAmmo[currentSlot].cur;
    document.getElementById('ammo-reserve').innerText = weaponAmmo[currentSlot].res;
    document.getElementById('hp').innerText = Math.max(0, Math.round(pState.hp));
    document.getElementById('hp-fill').style.width = Math.max(0, pState.hp) + '%';
}

// OYUN DÖNGÜSÜ
const clock = new THREE.Clock();
let animTimer = 0, stepTimer = 0;

function animate() {
    requestAnimationFrame(animate);
    let dt = clock.getDelta();

    if(!isGameStarted) {
        scene.rotation.y += dt * 0.08;
        renderer.render(scene, camera);
        return;
    }

    if(isPaused || pState.hp <= 0) return;

    playerGroup.rotation.y = yaw;
    camera.rotation.x = pitch;

    // Zıplama Fizik
    if (!isGrounded) {
        playerGroup.position.y += velocityY * dt;
        velocityY -= 18 * dt;
        let groundY = isCrouching ? 1.0 : 1.7;
        if (playerGroup.position.y <= groundY) {
            playerGroup.position.y = groundY; velocityY = 0; isGrounded = true;
        }
    }

    // PC Klavye
    if (!isMobile) {
        moveInput = { x: 0, y: 0 };
        if (keys['KeyW']) moveInput.y = -1;
        if (keys['KeyS']) moveInput.y = 1;
        if (keys['KeyA']) moveInput.x = -1;
        if (keys['KeyD']) moveInput.x = 1;
    }

    // Hareket ve Bıçak Koşu Hızı Bonusu (%30 Hızlı)
    let isMoving = (moveInput.x !== 0 || moveInput.y !== 0);
    if (isMoving) {
        let baseSpeed = (currentSlot === 3) ? 9.5 : 7.0;
        let speed = isCrouching ? 3.0 : baseSpeed;

        let forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        let side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        let moveDir = forward.multiplyScalar(-moveInput.y).add(side.multiplyScalar(moveInput.x));
        playerGroup.position.add(moveDir.multiplyScalar(speed * dt));

        stepTimer += dt * speed;
        if (stepTimer > 2.2 && isGrounded) {
            playSound('step');
            stepTimer = 0;
        }
    }

    // Silah Sallantı (Sway) Animasyonu
    animTimer += dt * (isMoving ? 10 : 2);
    if (!isAiming && !isSwitching && !isAttacking) {
        gunGroup.position.x = (isAiming ? 0 : 0.2) + Math.cos(animTimer * 0.5) * (isMoving ? 0.012 : 0.002);
        gunGroup.position.y = -0.2 + Math.sin(animTimer) * (isMoving ? 0.012 : 0.002);
    }

    // Düşman Yapay Zekası
    enemies.forEach((enemy) => {
        enemy.group.lookAt(playerGroup.position.x, 0, playerGroup.position.z);
        let dist = enemy.group.position.distanceTo(playerGroup.position);
        
        if (dist > 8) {
            enemy.group.translateZ(3.2 * dt);
        } else {
            let now = clock.getElapsedTime();
            if (now - enemy.lastShoot > 1.2) {
                enemy.lastShoot = now;
                pState.hp -= 10; updateHUD();
                if (pState.hp <= 0) document.getElementById('game-over').style.display = 'flex';
            }
        }
    });

    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
