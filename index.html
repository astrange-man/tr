<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Tactical FPS Pro - Ultimate Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; touch-action: none; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* Modern Glassmorphism Main Menu */
        #main-menu {
            position: absolute; inset: 0; z-index: 200;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.6) 0%, rgba(11, 14, 20, 0.95) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
            backdrop-filter: blur(12px);
        }
        .menu-title {
            font-size: 48px; font-weight: 900; letter-spacing: 4px;
            background: linear-gradient(135deg, #00ffcc, #00b894); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0,255,204,0.3); margin-bottom: 5px;
        }
        .menu-subtitle { color: #81e6d9; font-size: 14px; letter-spacing: 2px; margin-bottom: 30px; text-transform: uppercase; }

        .menu-btn {
            width: 220px; padding: 14px 0; margin: 8px 0;
            background: rgba(255, 255, 255, 0.05); border: 1.5px solid rgba(0, 255, 204, 0.4);
            color: #fff; font-weight: 800; font-size: 15px; border-radius: 12px; cursor: pointer;
            transition: all 0.25s ease; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .menu-btn:hover { background: rgba(0, 255, 204, 0.2); border-color: #00ffcc; transform: translateY(-2px); box-shadow: 0 0 20px rgba(0,255,204,0.4); }
        .menu-btn-primary { background: linear-gradient(135deg, #00ffcc, #00b894); color: #000; border: none; }
        .menu-btn-primary:hover { color: #000; background: linear-gradient(135deg, #55ffdd, #00b894); }

        /* Top HUD */
        #hud-top {
            position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
            display: flex; gap: 20px; background: rgba(15, 23, 42, 0.75); padding: 8px 24px;
            border-radius: 20px; border: 1px solid rgba(0, 255, 204, 0.3); color: #fff; font-weight: 800; font-size: 14px;
            backdrop-filter: blur(8px);
        }
        .score-val { color: #00ffcc; font-size: 16px; }

        /* Mobile Pause Button */
        #btn-pause-ui {
            position: absolute; top: 16px; right: 16px; z-index: 50;
            width: 44px; height: 44px; border-radius: 50%; background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2); display: none; align-items: center; justify-content: center;
            cursor: pointer; pointer-events: auto; backdrop-filter: blur(4px);
        }

        /* Bottom HUD */
        #hud-bottom {
            position: absolute; bottom: 20px; left: 20px; z-index: 10;
            display: flex; flex-direction: column; gap: 8px; pointer-events: none;
        }
        .hp-bar {
            width: 180px; height: 16px; background: rgba(0,0,0,0.7);
            border: 1.5px solid rgba(255,255,255,0.3); border-radius: 8px; overflow: hidden; position: relative;
        }
        #hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff4757, #ff6b81); transition: width 0.15s; }
        .hp-text { position: absolute; inset: 0; font-size: 10px; font-weight: 900; color: #fff; display: flex; align-items: center; justify-content: center; }
        #ammo-ui { color: #eccc68; font-size: 18px; font-weight: 900; text-shadow: 1px 1px 4px #000; letter-spacing: 1px; }

        /* Mobile Weapon Slots */
        #weapon-slots {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 30;
            display: none; gap: 10px; background: rgba(15, 23, 42, 0.75); padding: 6px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px);
        }
        .slot-box {
            width: 55px; height: 55px; border-radius: 8px; background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.2); display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer; color: #aaa; transition: 0.2s;
        }
        .slot-box.active {
            border-color: #00ffcc; background: rgba(0, 255, 204, 0.25); color: #fff;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.4); transform: scale(1.05);
        }
        .slot-box svg { width: 22px; height: 22px; fill: currentColor; }
        .slot-box span { font-size: 9px; font-weight: bold; margin-top: 2px; }

        /* Dynamic Crosshair */
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 16px; height: 16px; pointer-events: none; z-index: 15;
            display: flex; align-items: center; justify-content: center;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #00ffcc; box-shadow: 0 0 6px #00ffcc; }
        #crosshair::before { width: 2px; height: 12px; }
        #crosshair::after { width: 12px; height: 2px; }

        /* Melee Slash Effect Overlay */
        #slash-effect {
            position: absolute; inset: 0; pointer-events: none; z-index: 14; opacity: 0;
            background: radial-gradient(ellipse at center, rgba(0, 255, 204, 0.3) 0%, transparent 70%);
            transition: opacity 0.1s;
        }

        /* Mobile Controls UI */
        #mobile-controls { display: none; }
        #touch-container { position: absolute; inset: 0; z-index: 20; }
        #move-zone { position: absolute; top: 0; left: 0; width: 50vw; height: 100vh; }
        #look-zone { position: absolute; top: 0; right: 0; width: 50vw; height: 100vh; }
        
        #joy-base {
            position: absolute; width: 110px; height: 110px; background: rgba(255,255,255,0.08);
            border: 2px solid rgba(0, 255, 204, 0.5); border-radius: 50%; display: none; pointer-events: none;
        }
        #joy-knob {
            position: absolute; top: 30px; left: 30px; width: 50px; height: 50px;
            background: rgba(0, 255, 204, 0.75); border-radius: 50%; pointer-events: none; box-shadow: 0 0 12px #00ffcc;
        }

        #btn-group { position: absolute; bottom: 20px; right: 20px; display: grid; grid-template-columns: repeat(3, 58px); gap: 10px; z-index: 30; }
        .btn-svg {
            width: 58px; height: 58px; border-radius: 50%; background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(255,255,255,0.3); color: white;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5); backdrop-filter: blur(4px);
        }
        .btn-svg svg { width: 24px; height: 24px; fill: currentColor; }
        .btn-fire { background: linear-gradient(135deg, #ff4757, #ff6b81); border-color: #ff7675; grid-row: span 2; height: 126px; border-radius: 30px; }

        /* Detailed Settings Panel Modal */
        #settings-menu {
            display: none; position: absolute; inset: 0; background: rgba(11, 14, 20, 0.92);
            z-index: 300; flex-direction: column; align-items: center; justify-content: center; color: #fff;
            backdrop-filter: blur(16px);
        }
        .settings-card {
            background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(0, 255, 204, 0.3);
            padding: 24px 32px; border-radius: 20px; width: 340px; display: flex; flex-direction: column; gap: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .setting-box { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; }
        .setting-box select, .setting-box input[type="range"] {
            background: #1e272e; color: #00ffcc; border: 1px solid rgba(0,255,204,0.4);
            padding: 4px 8px; border-radius: 6px; font-weight: bold; outline: none;
        }

        #game-over { display: none; position: absolute; inset: 0; background: rgba(10, 10, 15, 0.95); color: #ff4757; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

    <!-- Gelişmiş Ana Menü -->
    <div id="main-menu">
        <div class="menu-title">TACTICAL FPS</div>
        <div class="menu-subtitle" id="device-info">Yükleniyor...</div>
        <button class="menu-btn menu-btn-primary" onclick="startGame()">Oyuna Başla</button>
        <button class="menu-btn" onclick="openSettings()">Ayarlar</button>
    </div>

    <div id="crosshair"></div>
    <div id="slash-effect"></div>

    <div id="hud-top">
        <div>LEŞ: <span id="kills" class="score-val">0</span></div>
        <div style="color:rgba(255,255,255,0.2);">|</div>
        <div>SKOR: <span id="score" class="score-val" style="color:#eccc68;">0</span></div>
    </div>

    <!-- Mobil Duraklatma Butonu -->
    <div id="btn-pause-ui">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </div>

    <div id="hud-bottom">
        <div id="ammo-ui">AMMO: <span id="ammo-cur">30</span> / <span id="ammo-reserve">90</span></div>
        <div class="hp-bar">
            <div id="hp-fill"></div>
            <div class="hp-text">HP: <span id="hp">100</span></div>
        </div>
    </div>

    <!-- Mobil Silah Slotları -->
    <div id="weapon-slots">
        <div class="slot-box active" id="slot-1" onclick="switchWeapon(1)">
            <svg viewBox="0 0 24 24"><path d="M21 7l-5-2-4 2-4-2-5 2v10l5-2 4 2 4-2 5 2V7z"/></svg>
            <span>1. TÜFEK</span>
        </div>
        <div class="slot-box" id="slot-2" onclick="switchWeapon(2)">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>
            <span>2. TABANCA</span>
        </div>
        <div class="slot-box" id="slot-3" onclick="switchWeapon(3)">
            <svg viewBox="0 0 24 24"><path d="M14.12 10.47L12 12.59l-2.12-2.12-2.12 2.12L9.88 14.71 12 12.59l2.12 2.12 2.12-2.12zM19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
            <span>3. BIÇAK</span>
        </div>
    </div>

    <!-- Mobil Dokunmatik Bitiş UI -->
    <div id="mobile-controls">
        <div id="touch-container">
            <div id="move-zone"></div>
            <div id="look-zone"></div>
            <div id="joy-base"><div id="joy-knob"></div></div>
        </div>

        <div id="btn-group">
            <div class="btn-svg" id="btn-aim">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7.44-7.93H7v-2H5.56c.44-4.08 3.5-7.44 7.44-7.93V5h2v1.57c3.95.49 7 3.85 7.44 7.93H18v2h1.44c-.44 4.08-3.5 7.44-7.44 7.93V19h-2v.93z"/></svg>
            </div>
            <div class="btn-svg" id="btn-reload">
                <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
            </div>
            <div class="btn-svg btn-fire" id="btn-fire">
                <svg viewBox="0 0 24 24"><path d="M12 23c6.075 0 11-4.925 11-11S18.075 1 12 1 1 5.925 1 12s4.925 11 11 11zm0-18a7 7 0 110 14 7 7 0 010-14z"/></svg>
            </div>
            <div class="btn-svg" id="btn-jump">
                <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
            </div>
            <div class="btn-svg" id="btn-crouch">
                <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-5V4h-6v8H4z"/></svg>
            </div>
        </div>
    </div>

    <!-- Detaylı Ayarlar Menüsü Modal -->
    <div id="settings-menu">
        <div class="settings-card">
            <h3 style="color:#00ffcc; text-align:center; margin-bottom:8px;">OYUN AYARLARI</h3>
            
            <div class="setting-box">
                <span>Grafik Kalitesi:</span>
                <select id="gfx-quality" onchange="applySettings()">
                    <option value="ultra">Ultra (Yüksek Gölgeler)</option>
                    <option value="high" selected>Yüksek</option>
                    <option value="low">Düşük (Performans)</option>
                </select>
            </div>

            <div class="setting-box">
                <span>Görüş Açısı (FOV):</span>
                <input type="range" id="fov-slider" min="60" max="100" value="75" onchange="applySettings()">
            </div>

            <div class="setting-box">
                <span>Hassasiyet:</span>
                <input type="range" id="sens-slider" min="1" max="10" value="5" onchange="applySettings()">
            </div>

            <div class="setting-box">
                <span>Genel Ses:</span>
                <input type="range" id="volume-slider" min="0" max="10" value="8" onchange="applySettings()">
            </div>

            <div class="setting-box" id="gyro-option" style="display:none;">
                <span>Jiroskop (Mobil):</span>
                <input type="checkbox" id="gyro-toggle" onchange="toggleGyro()">
            </div>

            <button class="menu-btn menu-btn-primary" style="width:100%; margin-top:10px;" onclick="closeSettings()">KAYDET & KAPAT</button>
        </div>
    </div>

    <div id="game-over">
        <h1 style="font-size: 42px; text-shadow: 0 0 15px #ff4757;">ÖLDÜN!</h1>
        <button onclick="location.reload()" class="menu-btn menu-btn-primary" style="margin-top:20px;">YENİDEN BAŞLA</button>
    </div>

<script>
// DAHİLİ SES SENTEZLEYİCİSİ (WEB AUDIO API)
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
}

function playSound(type) {
    if (!audioCtx || settings.volume === 0) return;
    let masterGain = audioCtx.createGain();
    masterGain.gain.value = settings.volume;
    masterGain.connect(audioCtx.destination);

    if (type === 'shoot') {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.connect(gain); gain.connect(masterGain);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    } 
    else if (type === 'knife_swoosh') {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.connect(gain); gain.connect(masterGain);
        osc.start(); osc.stop(audioCtx.currentTime + 0.12);
    }
    else if (type === 'hit') {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain); gain.connect(masterGain);
        osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    }
    else if (type === 'reload') {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.setValueAtTime(250, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.connect(gain); gain.connect(masterGain);
        osc.start(); osc.stop(audioCtx.currentTime + 0.25);
    }
    else if (type === 'step') {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(60, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.connect(gain); gain.connect(masterGain);
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    }
}

// CİHAZ VE SİSTEM TESPİTİ
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
document.getElementById('device-info').innerText = isMobile ? "Mobil Cihaz (Dokunmatik)" : "PC Platformu (Klavye & Fare)";

if (isMobile) {
    document.getElementById('mobile-controls').style.display = 'block';
    document.getElementById('btn-pause-ui').style.display = 'flex';
    document.getElementById('weapon-slots').style.display = 'flex';
    document.getElementById('gyro-option').style.display = 'flex';
}

let settings = { graphics: 'high', sens: 0.003, fov: 75, volume: 0.8, gyro: false };
let isPaused = false, isGameStarted = false;

// THREE.JS SAHNE VE GRAFİK AYARLARI
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f172a);
scene.fog = new THREE.FogExp2(0x0f172a, 0.012);

const camera = new THREE.PerspectiveCamera(settings.fov, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xdfe6e9, 0.7);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfffae6, 1.6);
sunLight.position.set(80, 120, 50);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
scene.add(sunLight);

// Zemin
const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e272e, roughness: 0.8, metalness: 0.2 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(300, 60, 0x00ffcc, 0x334155);
grid.position.y = 0.01;
scene.add(grid);

// Harita Binaları & Engeller
function createBuilding(x, z, w, h, d, color = 0x334155) {
    const group = new THREE.Group();
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: 0.7 }));
    mesh.position.y = h / 2; mesh.castShadow = true; mesh.receiveShadow = true;
    group.add(mesh);
    group.position.set(x, 0, z);
    scene.add(group);
}
createBuilding(-40, -40, 20, 16, 20);
createBuilding(40, -40, 20, 16, 20);
createBuilding(0, -70, 30, 20, 15);

// Oyuncu Objesi
const playerGroup = new THREE.Group();
playerGroup.position.set(0, 1.7, 40);
scene.add(playerGroup); playerGroup.add(camera);

// DETAYLI SİLAH VE BIÇAK MODELLERİ
const gunGroup = new THREE.Group();
gunGroup.position.set(0.22, -0.22, -0.42);
camera.add(gunGroup);

const matDark = new THREE.MeshStandardMaterial({color: 0x0f172a, roughness: 0.3, metalness: 0.8});
const matMetal = new THREE.MeshStandardMaterial({color: 0x475569, roughness: 0.2, metalness: 0.9});

// 1. Tüfek
const rifleMesh = new THREE.Group();
const rBody = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.09, 0.45), matDark);
const rBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.55), matMetal);
rBarrel.rotation.x = Math.PI / 2; rBarrel.position.set(0, 0.02, -0.42);
rifleMesh.add(rBody, rBarrel);

// 2. Tabanca
const pistolMesh = new THREE.Group();
const pSlide = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.05, 0.22), matMetal);
pSlide.position.set(0, 0.03, -0.05);
const pGrip = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.12, 0.06), matDark);
pGrip.position.set(0, -0.05, 0.02); pGrip.rotation.x = -0.2;
pistolMesh.add(pSlide, pGrip);
pistolMesh.visible = false;

// 3. Taktik Bıçak
const knifeMesh = new THREE.Group();
const kBladeMat = new THREE.MeshStandardMaterial({color: 0x00ffcc, metalness: 0.95, roughness: 0.1, emissive: 0x00ffcc, emissiveIntensity: 0.2});
const kHandle = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.04, 0.16), matDark);
const kBlade = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.05, 0.26), kBladeMat);
kBlade.position.set(0, 0.01, -0.2);
knifeMesh.add(kHandle, kBlade);
knifeMesh.visible = false;

gunGroup.add(rifleMesh, pistolMesh, knifeMesh);

// Muzzle Flash
const muzzleFlash = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), new THREE.MeshBasicMaterial({color: 0xffaa00, transparent: true, opacity: 0}));
muzzleFlash.position.set(0, 0.02, -0.72);
gunGroup.add(muzzleFlash);

// DÜŞMAN BOTLAR
let enemies = [];
function spawnEnemy() {
    const enemyGroup = new THREE.Group();
    const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.4, 0.6), new THREE.MeshStandardMaterial({color: 0xef4444}));
    bodyMesh.position.y = 0.7; bodyMesh.userData = { type: 'body' }; bodyMesh.castShadow = true;

    const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), new THREE.MeshStandardMaterial({color: 0xf87171}));
    headMesh.position.y = 1.7; headMesh.userData = { type: 'head' }; headMesh.castShadow = true;

    enemyGroup.add(bodyMesh, headMesh);

    let angle = Math.random() * Math.PI * 2, dist = 30 + Math.random() * 40;
    enemyGroup.position.set(playerGroup.position.x + Math.cos(angle)*dist, 0, playerGroup.position.z + Math.sin(angle)*dist);

    scene.add(enemyGroup);
    enemies.push({ group: enemyGroup, head: headMesh, body: bodyMesh, hp: 100, lastShoot: 0 });
}
for(let i=0; i<6; i++) spawnEnemy();

// SİLAH VE BIÇAK DEĞİŞTİRME MEKANİĞİ
let currentSlot = 1;
let weaponAmmo = { 1: { cur: 30, res: 90 }, 2: { cur: 12, res: 48 }, 3: { cur: '∞', res: '∞' } };
let isSwitching = false, switchAnimProgress = 0;

function switchWeapon(slot) {
    if(currentSlot === slot || isPaused || isSwitching) return;
    isSwitching = true; switchAnimProgress = 0;

    let switchInterval = setInterval(() => {
        switchAnimProgress += 0.15;
        gunGroup.position.y = -0.22 - Math.sin(switchAnimProgress * Math.PI) * 0.35;

        if (switchAnimProgress >= 0.5 && currentSlot !== slot) {
            currentSlot = slot;
            rifleMesh.visible = (slot === 1);
            pistolMesh.visible = (slot === 2);
            knifeMesh.visible = (slot === 3);

            if(isMobile) {
                document.querySelectorAll('.slot-box').forEach(el => el.classList.remove('active'));
                document.getElementById(`slot-${slot}`).classList.add('active');
            }
            updateHUD();
        }

        if (switchAnimProgress >= 1.0) {
            clearInterval(switchInterval);
            gunGroup.position.y = -0.22;
            isSwitching = false;
        }
    }, 20);
}

// OYUNU BAŞLATMA VE MENÜ KONTROLLERİ
function startGame() {
    initAudio();
    document.getElementById('main-menu').style.display = 'none';
    isGameStarted = true;

    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    if (!isMobile) document.body.requestPointerLock();
}

function openSettings() {
    document.getElementById('settings-menu').style.display = 'flex';
}

function closeSettings() {
    document.getElementById('settings-menu').style.display = 'none';
    if(isGameStarted && !isMobile && !isPaused) document.body.requestPointerLock();
}

function pauseGame() {
    isPaused = true;
    openSettings();
    if (document.exitPointerLock) document.exitPointerLock();
}

function resumeGame() {
    isPaused = false;
    closeSettings();
}

// KONTROLLER
let keys = {};
window.addEventListener('keydown', e => {
    if(!isGameStarted) return;
    keys[e.code] = true;
    
    if (e.code === 'KeyR') reloadGun();
    if (e.code === 'KeyP' || e.code === 'Escape') {
        if(isPaused) resumeGame(); else pauseGame();
    }
    if (e.code === 'Digit1') switchWeapon(1);
    if (e.code === 'Digit2') switchWeapon(2);
    if (e.code === 'Digit3') switchWeapon(3);
    if (e.code === 'Space') jumpPlayer();
});
window.addEventListener('keyup', e => keys[e.code] = false);

window.addEventListener('mousemove', e => {
    if (!isMobile && document.pointerLockElement === document.body && !isPaused) {
        yaw -= e.movementX * settings.sens;
        pitch -= e.movementY * settings.sens;
        pitch = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, pitch));
    }
});

window.addEventListener('mousedown', e => {
    if (!isMobile && isGameStarted && !isPaused) {
        if (e.button === 0) handleAttack();
        if (e.button === 2) toggleAim();
    }
});
window.addEventListener('contextmenu', e => e.preventDefault());

// MOBİL KONTROLLER
let moveInput = { x: 0, y: 0 }, yaw = 0, pitch = 0;
let moveTouchId = null, lookTouchId = null;
let joyCenter = { x: 0, y: 0 }, lastLookPos = { x: 0, y: 0 };

if (isMobile) {
    const moveZone = document.getElementById('move-zone');
    const lookZone = document.getElementById('look-zone');
    const joyBase = document.getElementById('joy-base');
    const joyKnob = document.getElementById('joy-knob');

    moveZone.addEventListener('touchstart', e => {
        e.preventDefault();
        for (let t of e.changedTouches) {
            if (moveTouchId === null) {
                moveTouchId = t.identifier;
                joyCenter = { x: t.clientX, y: t.clientY };
                joyBase.style.left = (t.clientX - 55) + 'px';
                joyBase.style.top = (t.clientY - 55) + 'px';
                joyBase.style.display = 'block';
            }
        }
    }, {passive: false});

    lookZone.addEventListener('touchstart', e => {
        e.preventDefault();
        for (let t of e.changedTouches) {
            if (lookTouchId === null) {
                lookTouchId = t.identifier;
                lastLookPos = { x: t.clientX, y: t.clientY };
            }
        }
    }, {passive: false});

    window.addEventListener('touchmove', e => {
        for (let t of e.touches) {
            if (t.identifier === moveTouchId) {
                let dx = t.clientX - joyCenter.x, dy = t.clientY - joyCenter.y;
                let dist = Math.hypot(dx, dy), maxDist = 45;
                if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
                joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                moveInput.x = dx / maxDist; moveInput.y = dy / maxDist;
            }
            if (t.identifier === lookTouchId) {
                let dx = t.clientX - lastLookPos.x, dy = t.clientY - lastLookPos.y;
                yaw -= dx * settings.sens; pitch -= dy * settings.sens;
                pitch = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, pitch));
                lastLookPos = { x: t.clientX, y: t.clientY };
            }
        }
    }, {passive: false});

    const resetTouch = (id) => {
        if (id === moveTouchId) { moveTouchId = null; moveInput = { x: 0, y: 0 }; joyBase.style.display = 'none'; }
        if (id === lookTouchId) lookTouchId = null;
    };
    window.addEventListener('touchend', e => { for (let t of e.changedTouches) resetTouch(t.identifier); });

    document.getElementById('btn-fire').addEventListener('touchstart', e => { e.preventDefault(); handleAttack(); });
    document.getElementById('btn-aim').addEventListener('touchstart', e => { e.preventDefault(); toggleAim(); });
    document.getElementById('btn-reload').addEventListener('touchstart', e => { e.preventDefault(); reloadGun(); });
    document.getElementById('btn-jump').addEventListener('touchstart', e => { e.preventDefault(); jumpPlayer(); });
    document.getElementById('btn-crouch').addEventListener('touchstart', e => { e.preventDefault(); crouchPlayer(); });
    document.getElementById('btn-pause-ui').addEventListener('click', (e) => { e.stopPropagation(); pauseGame(); });
}

function applySettings() {
    let qual = document.getElementById('gfx-quality').value;
    renderer.shadowMap.enabled = (qual !== 'low');
    settings.fov = parseInt(document.getElementById('fov-slider').value);
    camera.fov = settings.fov; camera.updateProjectionMatrix();
    settings.sens = document.getElementById('sens-slider').value * 0.0007;
    settings.volume = document.getElementById('volume-slider').value / 10;
}

// ATEŞ VE BIÇAK SALDIRI SİSTEMİ
let pState = { hp: 100, kills: 0, score: 0 };
let velocityY = 0, isGrounded = true, isCrouching = false, isAiming = false;
let isAttacking = false;

function handleAttack() {
    if(isSwitching || isAttacking) return;

    if (currentSlot === 3) {
        // BIÇAK SALDIRISI (MELEE SWIPE ANIMATION)
        isAttacking = true;
        playSound('knife_swoosh');

        // Bıçak Saplama / Kesme Animasyonu
        gunGroup.position.z = -0.2;
        gunGroup.position.x = 0.05;
        gunGroup.rotation.y = -0.8;
        
        document.getElementById('slash-effect').style.opacity = '1';

        setTimeout(() => {
            gunGroup.position.z = -0.42;
            gunGroup.position.x = 0.22;
            gunGroup.rotation.y = 0;
            document.getElementById('slash-effect').style.opacity = '0';
            isAttacking = false;
        }, 180);

        // Yakın Mesafe Hit-Check (Max 2.5 Metre)
        enemies.forEach((enemy, index) => {
            let dist = enemy.group.position.distanceTo(playerGroup.position);
            if (dist <= 2.8) {
                playSound('hit');
                enemy.hp -= 75; // Bıçak yüksek yakın mesafe hasarı
                pState.score += 100;

                if(enemy.hp <= 0) {
                    scene.remove(enemy.group);
                    enemies.splice(index, 1);
                    pState.kills++; updateHUD();
                    setTimeout(spawnEnemy, 2000);
                }
            }
        });

    } else {
        // ATEŞLİ SİLAH ATEŞİ
        let wData = weaponAmmo[currentSlot];
        if (wData.cur <= 0) { reloadGun(); return; }

        wData.cur--; updateHUD();
        playSound('shoot');

        // Recoil & Flash
        gunGroup.position.z = -0.32;
        pitch += 0.012;
        muzzleFlash.material.opacity = 1;

        setTimeout(() => { gunGroup.position.z = -0.42; muzzleFlash.material.opacity = 0; }, 50);

        // Raycast Shoot
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

        enemies.forEach((enemy, index) => {
            const intersects = raycaster.intersectObjects([enemy.head, enemy.body]);
            if(intersects.length > 0) {
                playSound('hit');
                let hitHead = intersects[0].object.userData.type === 'head';
                let dmg = currentSlot === 1 ? (hitHead ? 100 : 35) : (hitHead ? 70 : 25);

                enemy.hp -= dmg;
                pState.score += hitHead ? 150 : 50;

                if(enemy.hp <= 0) {
                    scene.remove(enemy.group);
                    enemies.splice(index, 1);
                    pState.kills++; updateHUD();
                    setTimeout(spawnEnemy, 2000);
                }
            }
        });
    }
}

function toggleAim() {
    if (currentSlot === 3) return;
    isAiming = !isAiming;
    camera.fov = isAiming ? 45 : settings.fov;
    gunGroup.position.set(isAiming ? 0 : 0.22, isAiming ? -0.14 : -0.22, isAiming ? -0.25 : -0.42);
    camera.updateProjectionMatrix();
}

function reloadGun() {
    if (currentSlot === 3 || isSwitching) return;
    let wData = weaponAmmo[currentSlot];
    let maxAmmo = (currentSlot === 1) ? 30 : 12;

    if (wData.cur < maxAmmo && wData.res > 0) {
        playSound('reload');
        let reloadAmount = Math.min(maxAmmo - wData.cur, wData.res);
        wData.res -= reloadAmount; wData.cur += reloadAmount;
        
        gunGroup.rotation.z = -0.6;
        setTimeout(() => { gunGroup.rotation.z = 0; updateHUD(); }, 400);
    }
}

function jumpPlayer() { if (isGrounded) { velocityY = 6.2; isGrounded = false; } }
function crouchPlayer() { isCrouching = !isCrouching; playerGroup.position.y = isCrouching ? 1.0 : 1.7; }

function updateHUD() {
    document.getElementById('kills').innerText = pState.kills;
    document.getElementById('score').innerText = pState.score;
    document.getElementById('ammo-cur').innerText = weaponAmmo[currentSlot].cur;
    document.getElementById('ammo-reserve').innerText = weaponAmmo[currentSlot].res;
    document.getElementById('hp').innerText = Math.max(0, Math.round(pState.hp));
    document.getElementById('hp-fill').style.width = Math.max(0, pState.hp) + '%';
}

// MAIN GAME LOOP
const clock = new THREE.Clock();
let animTimer = 0, stepTimer = 0;

function animate() {
    requestAnimationFrame(animate);
    let dt = clock.getDelta();

    // Menü Arka Plan Rotasyonu
    if(!isGameStarted) {
        scene.rotation.y += dt * 0.1;
        renderer.render(scene, camera);
        return;
    }

    if(isPaused || pState.hp <= 0) return;

    playerGroup.rotation.y = yaw;
    camera.rotation.x = pitch;

    // Zıplama Fizik
    if (!isGrounded) {
        playerGroup.position.y += velocityY * dt;
        velocityY -= 18 * dt;
        let groundY = isCrouching ? 1.0 : 1.7;
        if (playerGroup.position.y <= groundY) {
            playerGroup.position.y = groundY; velocityY = 0; isGrounded = true;
        }
    }

    // PC Klavye
    if (!isMobile) {
        moveInput = { x: 0, y: 0 };
        if (keys['KeyW']) moveInput.y = -1;
        if (keys['KeyS']) moveInput.y = 1;
        if (keys['KeyA']) moveInput.x = -1;
        if (keys['KeyD']) moveInput.x = 1;
    }

    // Hareket & Bıçak Hız Bonusu (%35 Koşu Hızı)
    let isMoving = (moveInput.x !== 0 || moveInput.y !== 0);
    if (isMoving) {
        let baseSpeed = (currentSlot === 3) ? 9.8 : 7.2;
        let speed = isCrouching ? 3.0 : baseSpeed;

        let forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        let side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        let moveDir = forward.multiplyScalar(-moveInput.y).add(side.multiplyScalar(moveInput.x));
        playerGroup.position.add(moveDir.multiplyScalar(speed * dt));

        // Adım Sesi
        stepTimer += dt * speed;
        if (stepTimer > 2.2 && isGrounded) {
            playSound('step');
            stepTimer = 0;
        }
    }

    // Silah Sway & Idle Animasyonu
    animTimer += dt * (isMoving ? 12 : 2.5);
    if (!isAiming && !isSwitching && !isAttacking) {
        gunGroup.position.x = (isAiming ? 0 : 0.22) + Math.cos(animTimer * 0.5) * (isMoving ? 0.015 : 0.003);
        gunGroup.position.y = -0.22 + Math.sin(animTimer) * (isMoving ? 0.015 : 0.003);
    }

    // Düşman Yapay Zekası
    enemies.forEach((enemy) => {
        enemy.group.lookAt(playerGroup.position.x, 0, playerGroup.position.z);
        let dist = enemy.group.position.distanceTo(playerGroup.position);
        
        if (dist > 10) {
            enemy.group.translateZ(3.5 * dt);
        } else {
            let now = clock.getElapsedTime();
            if (now - enemy.lastShoot > 1.0) {
                enemy.lastShoot = now;
                pState.hp -= 12; updateHUD();
                if (pState.hp <= 0) document.getElementById('game-over').style.display = 'flex';
            }
        }
    });

    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
