<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Tactical FPS Pro - Realistic & Dynamic Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; touch-action: none; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; }

        /* ANA MENÜ */
        #main-menu {
            position: absolute; inset: 0; background: radial-gradient(circle, #1a202c, #0b0e14); z-index: 300;
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
        }
        #main-menu h1 {
            font-size: 52px; letter-spacing: 5px; text-shadow: 0 0 30px #00ffcc;
            margin-bottom: 10px;
        }
        #main-menu .subtitle {
            color: rgba(255,255,255,0.4); font-size: 14px; margin-bottom: 40px;
            letter-spacing: 2px;
        }
        .menu-btn {
            padding: 14px 50px; background: rgba(255,255,255,0.05); border: 2px solid rgba(0, 255, 204, 0.3);
            color: #fff; font-weight: 700; font-size: 16px; border-radius: 30px; cursor: pointer;
            margin: 6px 0; width: 240px; transition: all 0.3s; text-transform: uppercase; letter-spacing: 2px;
            backdrop-filter: blur(4px);
        }
        .menu-btn:hover { background: rgba(0, 255, 204, 0.15); border-color: #00ffcc; box-shadow: 0 0 25px rgba(0,255,204,0.2); transform: scale(1.02); }
        .menu-btn.primary { background: linear-gradient(135deg, #00ffcc, #00b894); color: #000; border-color: #00ffcc; }
        .menu-btn.primary:hover { box-shadow: 0 0 40px rgba(0,255,204,0.4); }
        .menu-btn.danger { border-color: #ff4757; }
        .menu-btn.danger:hover { background: rgba(255,71,87,0.15); border-color: #ff4757; }

        /* Start Overlay (Eski başlangıç ekranı yerine main menu kullanılıyor) */
        #start-screen { display: none; }

        /* Top HUD */
        #hud-top {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
            display: flex; gap: 18px; background: rgba(15, 23, 42, 0.85); padding: 8px 24px;
            border-radius: 20px; border: 1.5px solid rgba(0, 255, 204, 0.4); color: #fff; font-weight: 800; font-size: 14px;
            backdrop-filter: blur(8px);
        }
        .score-val { color: #00ffcc; font-size: 16px; }

        /* Pause Button */
        #btn-pause-ui {
            position: absolute; top: 12px; right: 12px; z-index: 50;
            width: 44px; height: 44px; border-radius: 50%; background: rgba(15, 23, 42, 0.85);
            border: 1.5px solid rgba(255, 255, 255, 0.3); display: none; align-items: center; justify-content: center;
            cursor: pointer; pointer-events: auto; backdrop-filter: blur(4px);
        }

        /* Bottom HUD */
        #hud-bottom {
            position: absolute; bottom: 20px; left: 20px; z-index: 10;
            display: flex; flex-direction: column; gap: 8px; pointer-events: none;
        }
        .hp-bar {
            width: 170px; height: 16px; background: rgba(0,0,0,0.7);
            border: 1.5px solid rgba(255,255,255,0.4); border-radius: 8px; overflow: hidden; position: relative;
        }
        #hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff4757, #ff6b81); transition: width 0.15s; }
        .hp-text { position: absolute; inset: 0; font-size: 10px; font-weight: 900; color: #fff; display: flex; align-items: center; justify-content: center; }
        #ammo-ui { color: #eccc68; font-size: 18px; font-weight: 900; text-shadow: 1px 1px 4px #000; letter-spacing: 1px; }

        /* WEAPON SLOTS HUD */
        #weapon-slots {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 30;
            display: none; gap: 10px; background: rgba(15, 23, 42, 0.7); padding: 6px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px);
        }
        .slot-box {
            width: 55px; height: 55px; border-radius: 8px; background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.2); display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer; color: #aaa; transition: 0.2s;
        }
        .slot-box.active {
            border-color: #00ffcc; background: rgba(0, 255, 204, 0.25); color: #fff;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.4); transform: scale(1.05);
        }
        .slot-box svg { width: 22px; height: 22px; fill: currentColor; }
        .slot-box span { font-size: 9px; font-weight: bold; margin-top: 2px; }

        /* Dynamic Crosshair */
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 16px; height: 16px; pointer-events: none; z-index: 15;
            display: flex; align-items: center; justify-content: center; transition: transform 0.05s;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #00ffcc; box-shadow: 0 0 6px #00ffcc; }
        #crosshair::before { width: 2px; height: 12px; }
        #crosshair::after { width: 12px; height: 2px; }

        /* Mobile Controls */
        #mobile-controls { display: none; }
        #touch-container { position: absolute; inset: 0; z-index: 20; }
        #move-zone { position: absolute; top: 0; left: 0; width: 50vw; height: 100vh; }
        #look-zone { position: absolute; top: 0; right: 0; width: 50vw; height: 100vh; }
        
        #joy-base {
            position: absolute; width: 110px; height: 110px; background: rgba(255,255,255,0.08);
            border: 2px solid rgba(0, 255, 204, 0.5); border-radius: 50%; display: none; pointer-events: none;
        }
        #joy-knob {
            position: absolute; top: 30px; left: 30px; width: 50px; height: 50px;
            background: rgba(0, 255, 204, 0.75); border-radius: 50%; pointer-events: none; box-shadow: 0 0 12px #00ffcc;
        }

        #btn-group { position: absolute; bottom: 20px; right: 20px; display: grid; grid-template-columns: repeat(3, 58px); gap: 10px; z-index: 30; }
        .btn-svg {
            width: 58px; height: 58px; border-radius: 50%; background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(255,255,255,0.3); color: white;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5); backdrop-filter: blur(4px);
        }
        .btn-svg svg { width: 24px; height: 24px; fill: currentColor; }
        .btn-fire { background: linear-gradient(135deg, #ff4757, #ff6b81); border-color: #ff7675; grid-row: span 2; height: 126px; border-radius: 30px; }

        /* SETTINGS MODAL - DETAYLI */
        #settings-menu {
            display: none; position: absolute; inset: 0; background: rgba(11, 14, 20, 0.95);
            z-index: 100; flex-direction: column; align-items: center; justify-content: center; color: #fff;
            backdrop-filter: blur(10px); overflow-y: auto; padding: 20px;
        }
        .settings-title {
            font-size: 32px; color: #00ffcc; text-shadow: 0 0 20px rgba(0,255,204,0.3);
            margin-bottom: 25px; letter-spacing: 3px;
        }
        .setting-box {
            width: 300px; margin: 8px 0; display: flex; justify-content: space-between; align-items: center;
            font-weight: 500; font-size: 14px; padding: 6px 12px;
            background: rgba(255,255,255,0.03); border-radius: 8px; border-left: 2px solid rgba(0,255,204,0.2);
        }
        .setting-box label { color: rgba(255,255,255,0.8); }
        .setting-box select, .setting-box input[type="range"] {
            padding: 4px 8px; border-radius: 6px; background: #1e272e; color: #fff;
            border: 1px solid rgba(0,255,204,0.3); outline: none; cursor: pointer;
        }
        .setting-box input[type="range"] { width: 120px; accent-color: #00ffcc; }
        .setting-box input[type="checkbox"] { accent-color: #00ffcc; width: 18px; height: 18px; cursor: pointer; }
        .setting-value { color: #00ffcc; font-weight: bold; min-width: 30px; text-align: right; }

        .settings-subtitle {
            color: rgba(255,255,255,0.3); font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
            margin: 10px 0 5px 0; width: 300px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 4px;
        }

        .settings-close-btn {
            padding: 12px 40px; background: linear-gradient(135deg, #00ffcc, #00b894);
            color: #000; font-weight: 900; font-size: 16px; border: none; border-radius: 30px;
            cursor: pointer; margin-top: 20px; text-transform: uppercase; letter-spacing: 2px;
            transition: transform 0.2s;
        }
        .settings-close-btn:active { transform: scale(0.95); }

        /* GAME OVER */
        #game-over { display: none; position: absolute; inset: 0; background: rgba(10, 10, 15, 0.95); color: #ff4757; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }

        /* MOD MENÜSÜ */
        #mod-menu {
            display: none; position: absolute; inset: 0; background: rgba(11, 14, 20, 0.95);
            z-index: 200; flex-direction: column; align-items: center; justify-content: center; color: #fff;
            backdrop-filter: blur(10px);
        }
        .mod-btn {
            padding: 12px 40px; background: rgba(255,255,255,0.05); border: 2px solid rgba(0,255,204,0.2);
            color: #fff; font-weight: 700; font-size: 15px; border-radius: 30px; cursor: pointer;
            margin: 5px 0; width: 220px; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .mod-btn:hover { background: rgba(0,255,204,0.1); border-color: #00ffcc; }
        .mod-btn.active { background: rgba(0,255,204,0.2); border-color: #00ffcc; box-shadow: 0 0 20px rgba(0,255,204,0.2); }
    </style>
</head>
<body>

    <!-- ANA MENÜ -->
    <div id="main-menu">
        <h1>⚡ TACTICAL FPS</h1>
        <div class="subtitle">GERÇEKÇİ • DİNAMİK • TAKTİK</div>
        <button class="menu-btn primary" onclick="startGame()">▶ OYUNA BAŞLA</button>
        <button class="menu-btn" onclick="openSettings()">⚙ AYARLAR</button>
        <button class="menu-btn" onclick="openModMenu()">🎯 MODLAR</button>
        <button class="menu-btn danger" onclick="alert('Görüşürüz dostum! 👋')">✕ ÇIKIŞ</button>
        <div style="margin-top: 30px; font-size: 12px; color: rgba(255,255,255,0.15); letter-spacing: 1px;" id="device-info">Cihaz Algılanıyor...</div>
    </div>

    <!-- MOD MENÜSÜ -->
    <div id="mod-menu">
        <h2 style="color:#00ffcc; margin-bottom:20px; text-shadow: 0 0 15px #00ffcc;">🎯 OYUN MODLARI</h2>
        <button class="mod-btn active" id="mod-normal" onclick="selectMod('normal')">🟢 NORMAL</button>
        <button class="mod-btn" id="mod-easy" onclick="selectMod('easy')">🟡 KOLAY</button>
        <button class="mod-btn" id="mod-hard" onclick="selectMod('hard')">🔴 ZOR</button>
        <button class="mod-btn" id="mod-wave" onclick="selectMod('wave')">🌊 DALGA</button>
        <button class="menu-btn" style="margin-top:20px; width:160px;" onclick="closeModMenu()">← GERİ</button>
        <div style="margin-top: 12px; font-size:12px; color:rgba(255,255,255,0.3);">Mevcut Mod: <span id="current-mod-label">Normal</span></div>
    </div>

    <!-- ESKİ START EKRANI (GİZLİ) -->
    <div id="start-screen"></div>

    <div id="crosshair"></div>

    <div id="hud-top">
        <div>LEŞ: <span id="kills" class="score-val">0</span></div>
        <div style="color:rgba(255,255,255,0.2);">|</div>
        <div>SKOR: <span id="score" class="score-val" style="color:#eccc68;">0</span></div>
        <div style="color:rgba(255,255,255,0.2);">|</div>
        <div>MOD: <span id="hud-mod" style="color:#00ffcc; font-size:12px;">NORMAL</span></div>
    </div>

    <div id="btn-pause-ui">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </div>

    <div id="hud-bottom">
        <div id="ammo-ui">AMMO: <span id="ammo-cur">30</span> / <span id="ammo-reserve">90</span></div>
        <div class="hp-bar">
            <div id="hp-fill"></div>
            <div class="hp-text">HP: <span id="hp">100</span></div>
        </div>
    </div>

    <!-- 3'LÜ SİLAH SLOTLARI -->
    <div id="weapon-slots">
        <div class="slot-box active" id="slot-1" onclick="switchWeapon(1)">
            <svg viewBox="0 0 24 24"><path d="M21 7l-5-2-4 2-4-2-5 2v10l5-2 4 2 4-2 5 2V7z"/></svg>
            <span>TÜFEK</span>
        </div>
        <div class="slot-box" id="slot-2" onclick="switchWeapon(2)">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>
            <span>TABANCA</span>
        </div>
        <div class="slot-box" id="slot-3" onclick="switchWeapon(3)">
            <svg viewBox="0 0 24 24"><path d="M14.12 10.47L12 12.59l-2.12-2.12-2.12 2.12L9.88 14.71 12 12.59l2.12 2.12 2.12-2.12zM19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
            <span>BIÇAK</span>
        </div>
    </div>

    <!-- Mobil Kontroller -->
    <div id="mobile-controls">
        <div id="touch-container">
            <div id="move-zone"></div>
            <div id="look-zone"></div>
            <div id="joy-base"><div id="joy-knob"></div></div>
        </div>

        <div id="btn-group">
            <div class="btn-svg" id="btn-aim">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7.44-7.93H7v-2H5.56c.44-4.08 3.5-7.44 7.44-7.93V5h2v1.57c3.95.49 7 3.85 7.44 7.93H18v2h1.44c-.44 4.08-3.5 7.44-7.44 7.93V19h-2v.93z"/></svg>
            </div>
            <div class="btn-svg" id="btn-reload">
                <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
            </div>
            <div class="btn-svg btn-fire" id="btn-fire">
                <svg viewBox="0 0 24 24"><path d="M12 23c6.075 0 11-4.925 11-11S18.075 1 12 1 1 5.925 1 12s4.925 11 11 11zm0-18a7 7 0 110 14 7 7 0 010-14z"/></svg>
            </div>
            <div class="btn-svg" id="btn-jump">
                <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
            </div>
            <div class="btn-svg" id="btn-crouch">
                <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-5V4h-6v8H4z"/></svg>
            </div>
        </div>
    </div>

    <!-- DETAYLI AYARLAR MENÜSÜ -->
    <div id="settings-menu">
        <div class="settings-title">⚙ OYUN AYARLARI</div>
        
        <div class="settings-subtitle">GÖRÜNTÜ</div>
        
        <div class="setting-box">
            <label>Grafik Kalitesi</label>
            <select id="gfx-quality" onchange="applySettings()">
                <option value="high">Yüksek</option>
                <option value="low">Düşük</option>
            </select>
        </div>

        <div class="setting-box">
            <label>Görüş Açısı (FOV)</label>
            <input type="range" id="fov-slider" min="60" max="100" value="75" oninput="updateFOV(this.value)">
            <span class="setting-value" id="fov-value">75</span>
        </div>

        <div class="setting-box">
            <label>Crosshair Rengi</label>
            <input type="color" id="crosshair-color" value="#00ffcc" onchange="updateCrosshairColor()">
        </div>

        <div class="setting-box">
            <label>Crosshair Boyutu</label>
            <input type="range" id="crosshair-size" min="8" max="28" value="16" oninput="updateCrosshairSize(this.value)">
            <span class="setting-value" id="ch-size-value">16</span>
        </div>

        <div class="settings-subtitle">KONTROL</div>

        <div class="setting-box">
            <label>Fare Hassasiyeti</label>
            <input type="range" id="sens-slider" min="1" max="15" value="5" oninput="updateSensLabel(this.value)">
            <span class="setting-value" id="sens-value">5</span>
        </div>

        <div class="setting-box" id="gyro-option" style="display:none;">
            <label>Jiroskop (Mobil)</label>
            <input type="checkbox" id="gyro-toggle" onchange="toggleGyro()">
        </div>

        <div class="settings-subtitle">BUTON KONUMLARI (MOBİL)</div>

        <div class="setting-box">
            <label>Ateş Butonu</label>
            <select id="fire-pos" onchange="applyButtonLayout()">
                <option value="right">Sağ</option>
                <option value="left">Sol</option>
                <option value="center">Orta</option>
            </select>
        </div>

        <div class="setting-box">
            <label>Kontrol Boyutu</label>
            <input type="range" id="btn-size" min="40" max="80" value="58" oninput="updateBtnSize(this.value)">
            <span class="setting-value" id="btn-size-value">58</span>
        </div>

        <div class="settings-subtitle">SES (GELECEK)</div>
        <div class="setting-box" style="opacity:0.4;">
            <label>Ses Seviyesi</label>
            <input type="range" min="0" max="100" value="70" disabled>
            <span class="setting-value">70</span>
        </div>

        <button class="settings-close-btn" onclick="saveAndCloseSettings()">💾 KAYDET & KAPAT</button>
    </div>

    <div id="game-over">
        <h1 style="font-size: 42px; text-shadow: 0 0 15px #ff4757;">💀 ÖLDÜN!</h1>
        <p style="color:#fff; margin:10px 0;">Skor: <span id="final-score">0</span> | Leş: <span id="final-kills">0</span></p>
        <button onclick="location.reload()" class="menu-btn primary" style="width:auto; padding:12px 40px;">🔄 YENİDEN BAŞLA</button>
        <button onclick="goToMainMenu()" class="menu-btn" style="width:auto; padding:12px 40px; margin-top:8px;">🏠 ANA MENÜ</button>
    </div>

<script>
// ============================================================
// 1. CİHAZ VE MOD DEĞİŞKENLERİ
// ============================================================
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
document.getElementById('device-info').innerText = isMobile ? "📱 Mobil Cihaz" : "💻 PC";

// MOD SEÇİMİ
let currentMod = 'normal';
const modSettings = {
    normal: { label: 'NORMAL', enemySpeed: 3.5, enemyDamage: 12, enemyHP: 100, spawnCount: 6, playerSpeed: 7.2 },
    easy: { label: 'KOLAY', enemySpeed: 2.5, enemyDamage: 7, enemyHP: 80, spawnCount: 4, playerSpeed: 8.0 },
    hard: { label: 'ZOR', enemySpeed: 4.5, enemyDamage: 18, enemyHP: 130, spawnCount: 8, playerSpeed: 6.5 },
    wave: { label: 'DALGA', enemySpeed: 3.0, enemyDamage: 10, enemyHP: 90, spawnCount: 3, playerSpeed: 7.5 }
};

let waveLevel = 1;
let enemiesSpawnedThisWave = 0;
let maxEnemiesPerWave = 5;

function selectMod(mod) {
    currentMod = mod;
    document.querySelectorAll('.mod-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`mod-${mod}`).classList.add('active');
    document.getElementById('current-mod-label').innerText = modSettings[mod].label;
    document.getElementById('hud-mod').innerText = modSettings[mod].label;
    if (mod === 'wave') {
        waveLevel = 1;
        enemiesSpawnedThisWave = 0;
        maxEnemiesPerWave = 5;
    }
    localStorage.setItem('fps_mod', mod);
}

function openModMenu() {
    if (isGameStarted && pState.hp > 0) {
        pauseGame();
        document.getElementById('mod-menu').style.display = 'flex';
    } else {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('mod-menu').style.display = 'flex';
    }
}

function closeModMenu() {
    document.getElementById('mod-menu').style.display = 'none';
    if (isGameStarted && pState.hp > 0) {
        resumeGame();
    } else {
        document.getElementById('main-menu').style.display = 'flex';
    }
}

// ============================================================
// 2. KAYIT SİSTEMİ (localStorage)
// ============================================================
function loadSettings() {
    try {
        const saved = localStorage.getItem('fps_settings');
        if (saved) {
            const data = JSON.parse(saved);
            document.getElementById('gfx-quality').value = data.gfx || 'high';
            document.getElementById('fov-slider').value = data.fov || 75;
            document.getElementById('crosshair-color').value = data.chColor || '#00ffcc';
            document.getElementById('crosshair-size').value = data.chSize || 16;
            document.getElementById('sens-slider').value = data.sens || 5;
            document.getElementById('fire-pos').value = data.firePos || 'right';
            document.getElementById('btn-size').value = data.btnSize || 58;
            if (data.gyro !== undefined) document.getElementById('gyro-toggle').checked = data.gyro;
            applySettings();
            updateFOV(data.fov || 75);
            updateCrosshairColor();
            updateCrosshairSize(data.chSize || 16);
            updateBtnSize(data.btnSize || 58);
            updateSensLabel(data.sens || 5);
            applyButtonLayout();
            return data;
        }
    } catch(e) {}
    return null;
}

function saveSettings() {
    const data = {
        gfx: document.getElementById('gfx-quality').value,
        fov: parseInt(document.getElementById('fov-slider').value),
        chColor: document.getElementById('crosshair-color').value,
        chSize: parseInt(document.getElementById('crosshair-size').value),
        sens: parseInt(document.getElementById('sens-slider').value),
        firePos: document.getElementById('fire-pos').value,
        btnSize: parseInt(document.getElementById('btn-size').value),
        gyro: document.getElementById('gyro-toggle').checked
    };
    localStorage.setItem('fps_settings', JSON.stringify(data));
    return data;
}

function saveAndCloseSettings() {
    saveSettings();
    resumeGame();
}

// ============================================================
// 3. AYAR FONKSİYONLARI

function updateFOV(val) {
    document.getElementById('fov-value').innerText = val;
    if (isGameStarted && !isAiming) {
        camera.fov = parseInt(val);
        camera.updateProjectionMatrix();
    }
}

function updateCrosshairColor() {
    const color = document.getElementById('crosshair-color').value;
    document.querySelector('#crosshair::before').style.background = color;
    document.querySelector('#crosshair::after').style.background = color;
    document.querySelector('#crosshair::before').style.boxShadow = `0 0 6px ${color}`;
    document.querySelector('#crosshair::after').style.boxShadow = `0 0 6px ${color}`;
}

function updateCrosshairSize(val) {
    document.getElementById('ch-size-value').innerText = val;
    const size = parseInt(val);
    document.getElementById('crosshair').style.width = size + 'px';
    document.getElementById('crosshair').style.height = size + 'px';
    const half = size / 2;
    document.querySelector('#crosshair::before').style.height = size + 'px';
    document.querySelector('#crosshair::after').style.width = size + 'px';
}

function updateSensLabel(val) {
    document.getElementById('sens-value').innerText = val;
    settings.sens = parseInt(val) * 0.0007;
}

function updateBtnSize(val) {
    document.getElementById('btn-size-value').innerText = val;
    const size = parseInt(val);
    document.querySelectorAll('.btn-svg').forEach(b => {
        b.style.width = size + 'px';
        b.style.height = size + 'px';
    });
    document.querySelector('.btn-fire').style.height = (size * 2.17) + 'px';
}

function applyButtonLayout() {
    const pos = document.getElementById('fire-pos').value;
    const group = document.getElementById('btn-group');
    if (pos === 'left') {
        group.style.right = 'auto';
        group.style.left = '20px';
        group.style.gridTemplateColumns = 'repeat(3, 58px)';
    } else if (pos === 'center') {
        group.style.right = 'auto';
        group.style.left = '50%';
        group.style.transform = 'translateX(-50%)';
        group.style.gridTemplateColumns = 'repeat(3, 58px)';
    } else {
        group.style.right = '20px';
        group.style.left = 'auto';
        group.style.transform = 'none';
        group.style.gridTemplateColumns = 'repeat(3, 58px)';
    }
}

function applySettings() {
    const qual = document.getElementById('gfx-quality').value;
    renderer.shadowMap.enabled = (qual === 'high');
    const sensVal = parseInt(document.getElementById('sens-slider').value);
    settings.sens = sensVal * 0.0007;
    const fovVal = parseInt(document.getElementById('fov-slider').value);
    if (isGameStarted && !isAiming) {
        camera.fov = fovVal;
        camera.updateProjectionMatrix();
    }
    saveSettings();
}

function openSettings() {
    if (isGameStarted && pState.hp > 0) {
        pauseGame();
    } else {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('settings-menu').style.display = 'flex';
    }
}

let enemies = [];

function createHumanoidEnemy() {
    const group = new THREE.Group();
    
    // Gövde
    const bodyMat = new THREE.MeshStandardMaterial({color: 0xeb4d4b, roughness: 0.5});
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.5), bodyMat);
    body.position.y = 0.7;
    body.castShadow = true;
    body.userData = { type: 'body' };
    
    // Kafa
    const headMat = new THREE.MeshStandardMaterial({color: 0xffd1b3, roughness: 0.3});
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 10, 10), headMat);
    head.position.y = 1.55;
    head.castShadow = true;
    head.userData = { type: 'head' };
    
    // Kollar
    const armMat = new THREE.MeshStandardMaterial({color: 0xffd1b3, roughness: 0.4});
    const lArm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.5), armMat);
    lArm.position.set(-0.45, 1.1, 0);
    lArm.rotation.z = 0.2;
    const rArm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.5), armMat);
    rArm.position.set(0.45, 1.1, 0);
    rArm.rotation.z = -0.2;
    
    // Bacaklar
    const legMat = new THREE.MeshStandardMaterial({color: 0x2c3e50, roughness: 0.6});
    const lLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.6), legMat);
    lLeg.position.set(-0.18, 0.2, 0);
    const rLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.6), legMat);
    rLeg.position.set(0.18, 0.2, 0);
    
    // Düşman silahı (basit)
    const eGun = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.35), matDark);
    eGun.position.set(0.4, 0.9, -0.2);
    eGun.rotation.x = 0.2;
    
    group.add(body, head, lArm, rArm, lLeg, rLeg, eGun);
    
    // Animasyon için referanslar
    group.userData = {
        body: body, head: head, lArm: lArm, rArm: rArm, lLeg: lLeg, rLeg: rLeg,
        hp: 100, lastShoot: 0, walkPhase: 0
    };
    
    return group;
}

function spawnEnemy() {
    const enemyGroup = createHumanoidEnemy();
    const mod = modSettings[currentMod];
    enemyGroup.userData.hp = mod.enemyHP;
    
    let angle = Math.random() * Math.PI * 2;
    let dist = 25 + Math.random() * 45;
    let x = playerGroup.position.x + Math.cos(angle) * dist;
    let z = playerGroup.position.z + Math.sin(angle) * dist;
    enemyGroup.position.set(x, 0, z);
    
    // Rastgele renk
    const colors = [0xeb4d4b, 0x6c5ce7, 0xfdcb6e, 0x00b894, 0xe17055];
    enemyGroup.userData.body.material.color.setHex(colors[Math.floor(Math.random() * colors.length)]);
    
    scene.add(enemyGroup);
    enemies.push(enemyGroup);
}

function spawnEnemies(count) {
    for(let i=0; i<count; i++) spawnEnemy();
}

function startGame() {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('mod-menu').style.display = 'none';
    document.getElementById('settings-menu').style.display = 'none';
    
    isGameStarted = true;
    pState.hp = 100;
    pState.kills = 0;
    pState.score = 0;
    updateHUD();
    
    // Kayıtlı modu yükle
    const savedMod = localStorage.getItem('fps_mod');
    if (savedMod && modSettings[savedMod]) {
        currentMod = savedMod;
        document.getElementById('hud-mod').innerText = modSettings[currentMod].label;
        document.querySelectorAll('.mod-btn').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById(`mod-${currentMod}`);
        if (btn) btn.classList.add('active');
        document.getElementById('current-mod-label').innerText = modSettings[currentMod].label;
    }
    
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
    }
    if (!isMobile) {
        document.body.requestPointerLock();
    }
    
    if (isMobile) {
        document.getElementById('btn-pause-ui').style.display = 'flex';
        document.getElementById('weapon-slots').style.display = 'flex';
        document.getElementById('gyro-option').style.display = 'flex';
    }
    
    // Ayarları uygula
    const savedSettings = loadSettings();
    if (savedSettings) {
        document.getElementById('fov-slider').value = savedSettings.fov || 75;
        camera.fov = savedSettings.fov || 75;
        camera.updateProjectionMatrix();
    }
}

function goToMainMenu() {
    document.getElementById('game-over').style.display = 'none';
    document.getElementById('main-menu').style.display = 'flex';
    isGameStarted = false;
    if (document.exitPointerLock) document.exitPointerLock();
    // Düşmanları temizle
    enemies.forEach(e => scene.remove(e));
    enemies = [];
    spawnEnemies(6);
    playerGroup.position.set(0, 1.7, 40);
    pState.hp = 100;
    pState.kills = 0;
    pState.score = 0;
    updateHUD();
}

// 11. PC KONTROLLERİ
// ============================================================
window.addEventListener('keydown', e => {
    if(!isGameStarted || pState.hp <= 0) return;
    keys[e.code] = true;
    
    if (e.code === 'KeyR') reloadGun();
    if (e.code === 'KeyP' || e.code === 'Escape') {
        if(isPaused) resumeGame(); else pauseGame();
    }
    if (e.code === 'Digit1') switchWeapon(1);
    if (e.code === 'Digit2') switchWeapon(2);
    if (e.code === 'Digit3') switchWeapon(3);
    if (e.code === 'Space') jumpPlayer();
    if (e.code === 'KeyC') crouchPlayer();
    if (e.code === 'KeyQ') { 
        // Hızlı silah değiştirme
        let next = currentSlot === 3 ? 1 : currentSlot + 1;
        switchWeapon(next);
    }
});
window.addEventListener('keyup', e => keys[e.code] = false);

window.addEventListener('mousemove', e => {
    if (!isMobile && document.pointerLockElement === document.body && !isPaused && isGameStarted) {
        yaw -= e.movementX * settings.sens;
        pitch -= e.movementY * settings.sens;
        pitch = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, pitch));
    }
});

window.addEventListener('mousedown', e => {
    if (!isMobile && isGameStarted && !isPaused && pState.hp > 0) {
        if (e.button === 0) shootGun();
        if (e.button === 2) toggleAim();
    }
});
window.addEventListener('contextmenu', e => e.preventDefault());

// 12. MOBİL KONTROLLER
// ============================================================
let moveTouchId = null, lookTouchId = null;
let joyCenter = { x: 0, y: 0 }, lastLookPos = { x: 0, y: 0 };

if (isMobile) {
    const moveZone = document.getElementById('move-zone');
    const lookZone = document.getElementById('look-zone');
    const joyBase = document.getElementById('joy-base');
    const joyKnob = document.getElementById('joy-knob');

    moveZone.addEventListener('touchstart', e => {
        e.preventDefault();
        for (let t of e.changedTouches) {
            if (moveTouchId === null) {
                moveTouchId = t.identifier;
                joyCenter = { x: t.clientX, y: t.clientY };
                joyBase.style.left = (t.clientX - 55) + 'px';
                joyBase.style.top = (t.clientY - 55) + 'px';
                joyBase.style.display = 'block';
            }
        }
    }, {passive: false});

    lookZone.addEventListener('touchstart', e => {
        e.preventDefault();
        for (let t of e.changedTouches) {
            if (lookTouchId === null) {
                lookTouchId = t.identifier;
                lastLookPos = { x: t.clientX, y: t.clientY };
            }
        }
    }, {passive: false});

    window.addEventListener('touchmove', e => {
        for (let t of e.touches) {
            if (t.identifier === moveTouchId) {
                let dx = t.clientX - joyCenter.x, dy = t.clientY - joyCenter.y;
                let dist = Math.hypot(dx, dy), maxDist = 45;
                if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
                joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                moveInput.x = dx / maxDist; moveInput.y = dy / maxDist;
            }
            if (t.identifier === lookTouchId && !isPaused && isGameStarted) {
                let dx = t.clientX - lastLookPos.x, dy = t.clientY - lastLookPos.y;
                yaw -= dx * settings.sens; pitch -= dy * settings.sens;
                pitch = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, pitch));
                lastLookPos = { x: t.clientX, y: t.clientY };
            }
        }
    }, {passive: false});

    const resetTouch = (id) => {
        if (id === moveTouchId) { moveTouchId = null; moveInput = { x: 0, y: 0 }; joyBase.style.display = 'none'; }
        if (id === lookTouchId) lookTouchId = null;
    };
    window.addEventListener('touchend', e => { for (let t of e.changedTouches) resetTouch(t.identifier); });
    window.addEventListener('touchcancel', e => { for (let t of e.touches) resetTouch(t.identifier); });

    document.getElementById('btn-fire').addEventListener('touchstart', e => { e.preventDefault(); if(isGameStarted && pState.hp > 0) shootGun(); });
    document.getElementById('btn-aim').addEventListener('touchstart', e => { e.preventDefault(); toggleAim(); });
    document.getElementById('btn-reload').addEventListener('touchstart', e => { e.preventDefault(); reloadGun(); });
    document.getElementById('btn-jump').addEventListener('touchstart', e => { e.preventDefault(); jumpPlayer(); });
    document.getElementById('btn-crouch').addEventListener('touchstart', e => { e.preventDefault(); crouchPlayer(); });
}

// 13. JİROSKOP
// ============================================================
function toggleGyro() {
    if(!isMobile) return;
    settings.gyro = document.getElementById('gyro-toggle').checked;
    if (settings.gyro && window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', handleGyro);
    } else {
        window.removeEventListener('deviceorientation', handleGyro);
    }
    saveSettings();
}

function handleGyro(e) {
    if (!isPaused && isGameStarted && settings.gyro) {
        yaw -= e.gamma * 0.001;
        pitch -= e.beta * 0.001;
        pitch = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, pitch));
    }
}

// 14. OYUN MEKANİKLERİ
// ============================================================
function switchWeapon(slot) {
    if(currentSlot === slot || isPaused || isSwitching || pState.hp <= 0) return;
    isSwitching = true;
    switchAnimProgress = 0;

    let switchInterval = setInterval(() => {
        switchAnimProgress += 0.15;
        gunGroup.position.y = -0.22 - Math.sin(switchAnimProgress * Math.PI) * 0.35;

        if (switchAnimProgress >= 0.5 && currentSlot !== slot) {
            currentSlot = slot;
            rifleMesh.visible = (slot === 1);
            pistolMesh.visible = (slot === 2);
            knifeMesh.visible = (slot === 3);

            if(isMobile) {
                document.querySelectorAll('.slot-box').forEach(el => el.classList.remove('active'));
                document.getElementById(`slot-${slot}`).classList.add('active');
            }
            updateHUD();
        }

        if (switchAnimProgress >= 1.0) {
            clearInterval(switchInterval);
            gunGroup.position.y = -0.22;
            isSwitching = false;
        }
    }, 20);
}

function shootGun() {
    if(isSwitching || isPaused || pState.hp <= 0) return;
    let wData = weaponAmmo[currentSlot];
    if (currentSlot !== 3 && wData.cur <= 0) { reloadGun(); return; }

    if (currentSlot !== 3) wData.cur--;
    updateHUD();

    // Recoil
    gunGroup.position.z = -0.32;
    pitch += 0.015;
    if(currentSlot !== 3) {
        muzzleFlash.material.opacity = 1;
        muzzleLight.intensity = 3;
    }

    setTimeout(() => {
        gunGroup.position.z = -0.42;
        muzzleFlash.material.opacity = 0;
        muzzleLight.intensity = 0;
    }, 50);

    // Tracer
    const tracerMat = new THREE.LineBasicMaterial({ color: 0xffdd59 });
    const tracerGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0.2, -0.1, -0.5).applyMatrix4(camera.matrixWorld),
        new THREE.Vector3(0, 0, -50).applyMatrix4(camera.matrixWorld)
    ]);
    const tracer = new THREE.Line(tracerGeo, tracerMat);
    scene.add(tracer);
    setTimeout(() => scene.remove(tracer), 40);

    // Hit detection
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

    enemies.forEach((enemyGroup, index) => {
        const head = enemyGroup.userData.head;
        const body = enemyGroup.userData.body;
        if (!head || !body) return;
        
        const intersects = raycaster.intersectObjects([head, body]);
        if(intersects.length > 0) {
            let hitHead = intersects[0].object === head;
            
            let dmg = 35;
            if (currentSlot === 1) dmg = hitHead ? 100 : 35;
            if (currentSlot === 2) dmg = hitHead ? 70 : 25;
            if (currentSlot === 3) dmg = 65;

            enemyGroup.userData.hp -= dmg;
            pState.score += hitHead ? 150 : 50;

            if(enemyGroup.userData.hp <= 0) {
                scene.remove(enemyGroup);
                enemies.splice(index, 1);
                pState.kills++;
                updateHUD();
                
                // Dalga modu kontrolü
                if (currentMod === 'wave') {
                    enemiesSpawnedThisWave++;
                    if (enemiesSpawnedThisWave >= maxEnemiesPerWave) {
                        waveLevel++;
                        maxEnemiesPerWave = Math.min(5 + waveLevel * 2, 25);
                        enemiesSpawnedThisWave = 0;
                        // Yeni dalga
                        setTimeout(() => {
                            spawnEnemies(Math.min(3 + waveLevel, 10));
                        }, 1000);
                    } else {
                        setTimeout(spawnEnemy, 1500);
                    }
                } else {
                    setTimeout(spawnEnemy, 2000);
                }
            }
        }
    });
}

function toggleAim() {
    if (currentSlot === 3 || pState.hp <= 0) return;
    isAiming = !isAiming;
    const fovVal = parseInt(document.getElementById('fov-slider').value) || 75;
    camera.fov = isAiming ? 45 : fovVal;
    gunGroup.position.set(isAiming ? 0 : 0.22, isAiming ? -0.14 : -0.22, isAiming ? -0.25 : -0.42);
    camera.updateProjectionMatrix();
}

function reloadGun() {
    if (currentSlot === 3 || isSwitching || pState.hp <= 0) return;
    let wData = weaponAmmo[currentSlot];
    let maxAmmo = (currentSlot === 1) ? 30 : 12;

    if (wData.cur < maxAmmo && wData.res > 0) {
        let reloadAmount = Math.min(maxAmmo - wData.cur, wData.res);
        wData.res -= reloadAmount; wData.cur += reloadAmount;
        
        gunGroup.rotation.z = -0.6;
        gunGroup.position.y = -0.35;
        setTimeout(() => {
            gunGroup.rotation.z = 0;
            gunGroup.position.y = -0.22;
            updateHUD();
        }, 400);
    }
}

function jumpPlayer() { if (isGrounded && pState.hp > 0) { velocityY = 6.2; isGrounded = false; } }
function crouchPlayer() { 
    if (pState.hp <= 0) return;
    isCrouching = !isCrouching; 
    playerGroup.position.y = isCrouching ? 1.0 : 1.7; 
}

// ============================================================
// 15. HUD GÜNCELLEME
// ============================================================
function updateHUD() {
    document.getElementById('kills').innerText = pState.kills;
    document.getElementById('score').innerText = pState.score;
    const wData = weaponAmmo[currentSlot];
    document.getElementById('ammo-cur').innerText = wData.cur;
    document.getElementById('ammo-reserve').innerText = wData.res;
    document.getElementById('hp').innerText = Math.max(0, Math.round(pState.hp));
    document.getElementById('hp-fill').style.width = Math.max(0, pState.hp) + '%';
    document.getElementById('hud-mod').innerText = modSettings[currentMod].label;
}

// ============================================================
// 16. ANA OYUN DÖNGÜSÜ
// ============================================================
const clock = new THREE.Clock();
let enemySpawnTimer = 0;

function animate() {
    requestAnimationFrame(animate);
    let dt = clock.getDelta();

    if(!isGameStarted || isPaused || pState.hp <= 0) {
        if (pState.hp <= 0 && isGameStarted) {
            document.getElementById('final-score').innerText = pState.score;
            document.getElementById('final-kills').innerText = pState.kills;
            document.getElementById('game-over').style.display = 'flex';
        }
        renderer.render(scene, camera);
        return;
    }

    // Oyuncu rotasyonu
    playerGroup.rotation.y = yaw;
    camera.rotation.x = pitch;

    // Zıplama fizik
    if (!isGrounded) {
        playerGroup.position.y += velocityY * dt;
        velocityY -= 18 * dt;
        let groundY = isCrouching ? 1.0 : 1.7;
        if (playerGroup.position.y <= groundY) {
            playerGroup.position.y = groundY;
            velocityY = 0;
            isGrounded = true;
        }
    }

    // PC hareket
    if (!isMobile) {
        moveInput = { x: 0, y: 0 };
        if (keys['KeyW']) moveInput.y = -1;
        if (keys['KeyS']) moveInput.y = 1;
        if (keys['KeyA']) moveInput.x = -1;
        if (keys['KeyD']) moveInput.x = 1;
    }

    // Hareket
    let isMoving = (moveInput.x !== 0 || moveInput.y !== 0);
    if (isMoving) {
        const mod = modSettings[currentMod];
        let baseSpeed = (currentSlot === 3) ? mod.playerSpeed * 1.35 : mod.playerSpeed;
        let speed = isCrouching ? 3.0 : baseSpeed;

        let forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        let side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        let moveDir = forward.multiplyScalar(-moveInput.y).add(side.multiplyScalar(moveInput.x));
        playerGroup.position.add(moveDir.multiplyScalar(speed * dt));
    }

    // Silah sallantısı
    animTimer += dt * (isMoving ? (currentSlot === 3 ? 14 : 10) : 2.5);
    if (!isAiming && !isSwitching) {
        let swayX = Math.cos(animTimer * 0.5) * (isMoving ? 0.015 : 0.003);
        let swayY = Math.sin(animTimer) * (isMoving ? 0.015 : 0.003);
        gunGroup.position.x = (isAiming ? 0 : 0.22) + swayX;
        gunGroup.position.y = -0.22 + swayY;
    }

    // Düşman güncelleme
    const mod = modSettings[currentMod];
    enemies.forEach((enemyGroup, index) => {
        if (!enemyGroup) return;
        
        // Düşman yürüme animasyonu
        const walkPhase = enemyGroup.userData.walkPhase || 0;
        enemyGroup.userData.walkPhase = (walkPhase + dt * 3) % (Math.PI * 2);
        const legSwing = Math.sin(walkPhase) * 0.3;
        if (enemyGroup.userData.lLeg) {
            enemyGroup.userData.lLeg.rotation.x = legSwing;
            enemyGroup.userData.rLeg.rotation.x = -legSwing;
        }
        
        // Düşman takip
        const targetPos = playerGroup.position;
        const enemyPos = enemyGroup.position;
        const dx = targetPos.x - enemyPos.x;
        const dz = targetPos.z - enemyPos.z;
        const dist = Math.hypot(dx, dz);
        
        if (dist > 1.5 && dist < 80) {
            const speed = mod.enemySpeed * (currentMod === 'wave' ? 1 + (waveLevel * 0.05) : 1);
            const moveX = (dx / dist) * speed * dt;
            const moveZ = (dz / dist) * speed * dt;
            enemyPos.x += moveX;
            enemyPos.z += moveZ;
            
            // Düşmanın oyuncuya bakması
            enemyGroup.lookAt(targetPos.x, 0, targetPos.z);
        }
        
        // Düşman saldırısı
        if (dist < 12) {
            let now = clock.getElapsedTime();
            if (now - enemyGroup.userData.lastShoot > 1.5) {
                enemyGroup.userData.lastShoot = now;
                pState.hp -= mod.enemyDamage * (currentMod === 'hard' ? 1.3 : 1);
                updateHUD();
                if (pState.hp <= 0) {
                    document.getElementById('final-score').innerText = pState.score;
                    document.getElementById('final-kills').innerText = pState.kills;
                    document.getElementById('game-over').style.display = 'flex';
                }
            }
        }
    });

    renderer.render(scene, camera);
}

animate();

// ============================================================
// 17. PENCERE BOYUTU
// ============================================================
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// 18. BAŞLANGIÇ AYARLARI YÜKLE
// ============================================================
const loadedSettings = loadSettings();
if (loadedSettings) {
    if (loadedSettings.fov) camera.fov = loadedSettings.fov;
    camera.updateProjectionMatrix();
    updateCrosshairColor();
    updateCrosshairSize(loadedSettings.chSize || 16);
    updateBtnSize(loadedSettings.btnSize || 58);
    updateSensLabel(loadedSettings.sens || 5);
    applyButtonLayout();
}

// Kayıtlı modu yükle
const savedMod = localStorage.getItem('fps_mod');
if (savedMod && modSettings[savedMod]) {
    currentMod = savedMod;
    document.getElementById('hud-mod').innerText = modSettings[currentMod].label;
    document.querySelectorAll('.mod-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById(`mod-${currentMod}`);
    if (btn) btn.classList.add('active');
    document.getElementById('current-mod-label').innerText = modSettings[currentMod].label;
}

console.log('🎮 Tactical FPS Pro yüklendi! | Mod:', currentMod, '| Mobil:', isMobile);
</script>
